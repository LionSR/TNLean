version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    # gh-aw-actions must match the gh-aw compiler that generated each
    # .lock.yml; bump it only by recompiling with `gh aw compile`.
    ignore:
      - dependency-name: "github/gh-aw-actions*"
# docs-blueprint-sync.lock.yml is generated by `gh aw compile`; if an update
# PR touches it, regenerate instead of hand-merging.
