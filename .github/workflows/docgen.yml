name: Full documentation

on:
  schedule:
    # Run weekly on Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build docs from (default: main)'
        required: false
        default: 'main'

concurrency:
  group: docgen-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project and generate docs
    timeout-minutes: 330
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}

      - name: Build project
        uses: leanprover/lean-action@v1
        with:
          build: true
          # See pr-ci.yml: per-run lake caches evict the main build cache.
          use-github-cache: false

      - name: Install TeX and graphviz
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: docgen-v2
          extra-packages: latexmk texlive-science texlive-xetex texlive-fonts-extra

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@v1

      - name: Build blueprint bibliography
        run: python3 scripts/blueprint_bibtex.py

      - name: Build paper-gap PDFs
        run: bash scripts/build-paper-gaps.sh

      - name: Build blueprint
        working-directory: blueprint
        run: |
          leanblueprint pdf
          set -o pipefail
          tmp_output_file="$(mktemp)"

          set +o pipefail
          leanblueprint web 2>&1 | tee "$tmp_output_file"
          cmd_status=${PIPESTATUS[0]}
          set -o pipefail

          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          # A command plasTeX does not know reaches the page through whichever
          # template happens to share its name, and a node with no template at
          # all reaches it through the fallback. Both produced reader-visible
          # corruption from a build that reported success, so neither may be
          # published. This is the gate that pr-ci.yml applies to a branch.
          if grep -qE "WARNING: (unrecognized command/environment|Using default renderer)" \
               "$tmp_output_file"; then
            echo "::error::Blueprint uses a command the web renderer does not know; declare it in blueprint/src/Packages/_tnlean_patches.py"
            exit 1
          fi
          if [ "$cmd_status" -ne 0 ]; then
            exit "$cmd_status"
          fi
          if grep -R "tenkz SVG unavailable" web --include='*.html'; then
            echo "::error::Blueprint contains unrendered tenkz SVG placeholders"
            exit 1
          fi

      # A zero exit status says the build ran, not that the pages read. This
      # workflow publishes the site on its own schedule, so the reader-facing
      # check runs here too and not only where a pull request is reviewed.
      - name: Test generated blueprint pages
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Generate API docs
        run: |
          cd docbuild
          lake build TNLean:docs

      - name: Build FT-MPS blueprint volume
        run: ./scripts/build_blueprint_ch01_12.sh

      - name: Package site components
        run: |
          mkdir -p site-blueprint site-docs site-badges
          cp -r blueprint/web site-blueprint/blueprint
          cp blueprint/print/print.pdf site-blueprint/blueprint.pdf
          if [ -f blueprint/print/print12.pdf ]; then
            cp blueprint/print/print12.pdf site-blueprint/blueprint-ch01-12.pdf
          fi
          cp -r docbuild/.lake/build/doc site-docs/docs
          ./scripts/package-paper-gaps.sh site-docs/paper-gaps
          python3 scripts/write_badges.py site-badges

      # Runs in Docker and produces root-owned output; keep it after the
      # packaging step so it only writes into the pre-created directory.
      - name: Build homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: site-blueprint/homepage

      - name: Upload blueprint component
        uses: actions/upload-artifact@v4
        with:
          name: site-blueprint
          path: site-blueprint
          retention-days: 30

      - name: Upload docs component
        uses: actions/upload-artifact@v4
        with:
          name: site-docs
          path: site-docs
          retention-days: 90

      - name: Upload badges component
        uses: actions/upload-artifact@v4
        with:
          name: site-badges
          path: site-badges
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: build_project
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
