name: PR CI

# The pull-request pipeline: Lean build + style lint, blueprint lint and
# Lean-blueprint sync, and the Lean module-policy guards, formerly
# lean_action_ci.yml, lint-blueprint.yml, and oversized-lean-files.yml.
# One workflow means one completion event for the auto-fix dispatcher and
# per-job change gating: Lean-only changes skip the TeX pipeline, while
# blueprint changes also run the Lean build for compiled declaration checking.

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'texra-blueprint.toml'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_numbered_lean_files.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'docbuild/**'
      - 'scripts/check_docbuild_manifest.py'
      - 'scripts/coherent_qic_prerequisites.json'
      - 'scripts/export_coherent_qic_prerequisites.py'
      - 'scripts/test_export_coherent_qic_prerequisites.py'
      - 'scripts/coherent_tn_prerequisites.json'
      - 'scripts/export_coherent_tn_prerequisites.py'
      - 'scripts/test_export_coherent_tn_prerequisites.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/test_pr_ci_base_snapshot.py'
      - 'scripts/lake_build_locked.sh'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'scripts/ci_compatible_cache.py'
      - 'scripts/test_ci_compatible_cache.py'
      - 'scripts/test_ci_cache_lake_invalidation.py'
      - 'scripts/test_ci_fixture_overlay.py'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'tenkz.toml'
      - 'scripts/fetch_tenkz.py'
      - 'scripts/tenkz_paths.py'
      - 'scripts/prune_tenkz_render_cache.py'
      - 'scripts/test_prune_tenkz_render_cache.py'
      - 'blueprint/src/**'
      - 'docs/paper-gaps/**'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on merge pushes that only touch a scanned file.
      - 'blueprint/comments/**'
      - 'docs/**/*.md'
      - 'docs/slides/**'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/latexindent'
      - 'scripts/check_latexindent_formatting.sh'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_lean_sync.py'
      - 'scripts/paper_gap_leanid_sync.py'
      - 'scripts/test_paper_gap_leanid_sync.py'
      - 'scripts/badge_utils.py'
      - 'scripts/write_badges.py'
      - 'scripts/generate_badges.py'
      - 'scripts/test_badge_colors.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/add_blueprint_search.py'
      - 'scripts/test_add_blueprint_search.py'
      - 'scripts/test_blueprint_search_web.py'
      - 'scripts/check_reader_facing_prose.py'
      - 'scripts/audit_cpsv16_labels.py'
      - 'scripts/test_audit_cpsv16_labels.py'
      - 'Papers/1606.00608/**'
      - 'Papers/2502.20257/**'
      - 'scripts/generate_paper_aux.sh'
      - 'docs/audits/2026-05-08-mps-ft-paper-coverage.md'
      - 'docs/audits/2026-08-10-cpsv16-every-label-audit.md'
      - 'docs/audits/data/cpsv16-contained-result-anchors.tsv'
      - 'docs/audits/data/cpsv16-label-classifications.tsv'
      - 'docs/audits/data/cpsv16-label-dispositions.tsv'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_pic.py'
      - 'scripts/test_blueprint_pdf_capacity.py'
      - 'scripts/test_tenkz_equation_web.py'
      - 'scripts/test_tenkz_inline_web.py'
      - 'scripts/test_tenkz_peps_torus.py'
      - 'scripts/test_tenkz_canonical_pairs.py'
      - 'scripts/test_tenkz_peps_groundstate.py'
      - 'scripts/test_tenkz_peps_parent_spanning.py'
      - 'scripts/test_tenkz_peps_native_semiregular.py'
      - 'scripts/test_tenkz_peps_four_cut.py'
      - 'scripts/test_tenkz_peps_three_block.py'
      - 'scripts/test_tenkz_peps_parent_seams.py'
      - 'scripts/test_tenkz_peps_regular_reblocking.py'
      - 'scripts/test_tenkz_quantum_double_local_terms.py'
      - 'scripts/test_tenkz_quantum_double_source_construction.py'
      - 'scripts/check_peps_three_block_blueprint.py'
      - 'docs/audits/2026-10-05_scp10_three_block_blueprint_inventory.json'
      - 'scripts/check_peps_four_cut_blueprint.py'
      - 'docs/audits/2026-10-05_scp10_four_cut_blueprint_inventory.json'
      - 'scripts/test_tenkz_index_routing.py'
      - 'scripts/test_supported_polar_tree.py'
      - 'scripts/test_sector_encoder_diagram.py'
      - 'scripts/test_tenkz_ordered_mixing.py'
      - 'scripts/test_tenkz_sector_weight.py'
      - 'scripts/test_tenkz_string_endpoints.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/paper-gaps/**/*.tex'
      - 'docs/paper-gaps/**/*.bib'
      - 'texra-blueprint.toml'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on PRs that only touch a scanned file.
      - 'blueprint/comments/**'
      - 'docs/**/*.md'
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_numbered_lean_files.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'docbuild/**'
      - 'scripts/check_docbuild_manifest.py'
      - 'scripts/coherent_qic_prerequisites.json'
      - 'scripts/export_coherent_qic_prerequisites.py'
      - 'scripts/test_export_coherent_qic_prerequisites.py'
      - 'scripts/coherent_tn_prerequisites.json'
      - 'scripts/export_coherent_tn_prerequisites.py'
      - 'scripts/test_export_coherent_tn_prerequisites.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/test_pr_ci_base_snapshot.py'
      - 'scripts/lake_build_locked.sh'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'scripts/ci_compatible_cache.py'
      - 'scripts/test_ci_compatible_cache.py'
      - 'scripts/test_ci_cache_lake_invalidation.py'
      - 'scripts/test_ci_fixture_overlay.py'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'tenkz.toml'
      - 'scripts/fetch_tenkz.py'
      - 'scripts/tenkz_paths.py'
      - 'scripts/prune_tenkz_render_cache.py'
      - 'scripts/test_prune_tenkz_render_cache.py'
      - 'blueprint/src/**'
      - 'docs/slides/**'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/latexindent'
      - 'scripts/check_latexindent_formatting.sh'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_lean_sync.py'
      - 'scripts/paper_gap_leanid_sync.py'
      - 'scripts/test_paper_gap_leanid_sync.py'
      - 'scripts/badge_utils.py'
      - 'scripts/write_badges.py'
      - 'scripts/generate_badges.py'
      - 'scripts/test_badge_colors.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/add_blueprint_search.py'
      - 'scripts/test_add_blueprint_search.py'
      - 'scripts/test_blueprint_search_web.py'
      - 'scripts/check_reader_facing_prose.py'
      - 'scripts/audit_cpsv16_labels.py'
      - 'scripts/test_audit_cpsv16_labels.py'
      - 'Papers/1606.00608/**'
      - 'Papers/2502.20257/**'
      - 'scripts/generate_paper_aux.sh'
      - 'docs/audits/2026-05-08-mps-ft-paper-coverage.md'
      - 'docs/audits/2026-08-10-cpsv16-every-label-audit.md'
      - 'docs/audits/data/cpsv16-contained-result-anchors.tsv'
      - 'docs/audits/data/cpsv16-label-classifications.tsv'
      - 'docs/audits/data/cpsv16-label-dispositions.tsv'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_pic.py'
      - 'scripts/test_blueprint_pdf_capacity.py'
      - 'scripts/test_tenkz_equation_web.py'
      - 'scripts/test_tenkz_inline_web.py'
      - 'scripts/test_tenkz_peps_torus.py'
      - 'scripts/test_tenkz_canonical_pairs.py'
      - 'scripts/test_tenkz_peps_groundstate.py'
      - 'scripts/test_tenkz_peps_parent_spanning.py'
      - 'scripts/test_tenkz_peps_native_semiregular.py'
      - 'scripts/test_tenkz_peps_four_cut.py'
      - 'scripts/test_tenkz_peps_three_block.py'
      - 'scripts/test_tenkz_peps_parent_seams.py'
      - 'scripts/test_tenkz_peps_regular_reblocking.py'
      - 'scripts/test_tenkz_quantum_double_local_terms.py'
      - 'scripts/test_tenkz_quantum_double_source_construction.py'
      - 'scripts/check_peps_three_block_blueprint.py'
      - 'docs/audits/2026-10-05_scp10_three_block_blueprint_inventory.json'
      - 'scripts/check_peps_four_cut_blueprint.py'
      - 'docs/audits/2026-10-05_scp10_four_cut_blueprint_inventory.json'
      - 'scripts/test_tenkz_index_routing.py'
      - 'scripts/test_supported_polar_tree.py'
      - 'scripts/test_sector_encoder_diagram.py'
      - 'scripts/test_tenkz_ordered_mixing.py'
      - 'scripts/test_tenkz_sector_weight.py'
      - 'scripts/test_tenkz_string_endpoints.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main finish and save its build cache even during frequent merges.
  # Keep only the newest pending main run; PR updates still cancel older runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Build-cache policy: the cache is saved only from main and restored
# everywhere. lean-action's built-in GitHub cache is disabled because it
# saved a ~2.4 GB entry per PR run; those entries cycled through the 10 GB
# repository cache budget within minutes, evicting main's entry, so no run
# ever restored usable TNLean oleans and every run rebuilt all modules.
# Mathlib and its dependencies are intentionally excluded from the cache:
# `lake exe cache get` (run inside lean-action) restores them faster than
# a GitHub cache of that size could.
env:
  BUILD_CACHE_PATHS: |
    .lake/build
    .lake/packages/Gametheory/.lake/build
    .lake/packages/checkdecls/.lake/build
    .lake/packages/qiclean/.lake/build

jobs:
  # Per-job change gating. Push and dispatch runs skip this and run
  # every job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
      module_policy: ${{ steps.filter.outputs.module_policy }}
      blueprint: ${{ steps.filter.outputs.blueprint }}
      paper_gaps: ${{ steps.filter.outputs.paper_gaps }}
      workflow: ${{ steps.filter.outputs.workflow }}
      coherent_prerequisites: ${{ steps.filter.outputs.coherent_prerequisites }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lean:
              - '**.lean'
              - 'lakefile.*'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'scripts/LintStyle.lean'
              - 'scripts/nolints-style.txt'
              - 'scripts/coherent_qic_prerequisites.json'
              - 'scripts/export_coherent_qic_prerequisites.py'
              - 'scripts/test_export_coherent_qic_prerequisites.py'
              - 'scripts/coherent_tn_prerequisites.json'
              - 'scripts/export_coherent_tn_prerequisites.py'
              - 'scripts/test_export_coherent_tn_prerequisites.py'
              - 'scripts/ci_compatible_cache.py'
              - 'scripts/test_ci_compatible_cache.py'
              - 'scripts/test_ci_cache_lake_invalidation.py'
            coherent_prerequisites:
              - 'TNLean/MPS/Preparation/ExactSectorEncoder.lean'
              - 'TNLean/MPS/Preparation/SectorEncoderRates.lean'
              - 'TNLean/MPS/Preparation/CoherentGroundspaceConversion.lean'
              - 'TNLean/MPS/Preparation/SectorEncoderCompilation.lean'
              - 'TNLean/MPS/Preparation/SectorEncoderPreparation.lean'
              - 'TNLean/MPS/Preparation/SectorEncoderGroundspace.lean'
              - 'TNLean/MPS/Preparation/SectorSpectralGap.lean'
              - 'scripts/coherent_qic_prerequisites.json'
              - 'scripts/export_coherent_qic_prerequisites.py'
              - 'scripts/test_export_coherent_qic_prerequisites.py'
              - 'scripts/coherent_tn_prerequisites.json'
              - 'scripts/export_coherent_tn_prerequisites.py'
              - 'scripts/test_export_coherent_tn_prerequisites.py'
            module_policy:
              - 'scripts/check_numbered_lean_files.py'
              - 'scripts/check_oversized_lean_files.py'
              - 'scripts/lean_import_syntax.py'
              - 'scripts/test_lean_file_policies.py'
              - 'docbuild/**'
              - 'scripts/check_docbuild_manifest.py'
              - 'scripts/coherent_qic_prerequisites.json'
              - 'scripts/export_coherent_qic_prerequisites.py'
              - 'scripts/test_export_coherent_qic_prerequisites.py'
              - 'scripts/coherent_tn_prerequisites.json'
              - 'scripts/export_coherent_tn_prerequisites.py'
              - 'scripts/test_export_coherent_tn_prerequisites.py'
              - 'scripts/lake_build_hotspots.py'
              - 'scripts/test_lake_build_hotspots.py'
              - 'scripts/test_pr_ci_base_snapshot.py'
              - 'scripts/lake_build_locked.sh'
              - 'scripts/seed_lake_build.sh'
              - 'scripts/test_seed_lake_build.sh'
              - 'scripts/ci_compatible_cache.py'
              - 'scripts/test_ci_compatible_cache.py'
              - 'scripts/test_ci_cache_lake_invalidation.py'
              - 'scripts/test_ci_fixture_overlay.py'
              - 'docs/ci-automation.md'
              - 'docs/CONTRIBUTING.md'
            blueprint:
              - 'blueprint/src/**'
              - 'texra-blueprint.toml'
              - 'tenkz.toml'
              - 'scripts/fetch_tenkz.py'
              - 'scripts/tenkz_paths.py'
              - 'scripts/prune_tenkz_render_cache.py'
              - 'scripts/test_prune_tenkz_render_cache.py'
              - 'docs/slides/**'
              - 'blueprint/.chktexrc'
              - 'blueprint/latexindent.yaml'
              - 'scripts/latexindent'
              - 'scripts/check_latexindent_formatting.sh'
              - 'scripts/check_reader_facing_prose.py'
              - 'scripts/badge_utils.py'
              - 'scripts/write_badges.py'
              - 'scripts/generate_badges.py'
              - 'scripts/test_badge_colors.py'
              - 'scripts/test_blueprint_web_render.py'
              - 'scripts/add_blueprint_search.py'
              - 'scripts/test_add_blueprint_search.py'
              - 'scripts/test_blueprint_search_web.py'
              - 'scripts/tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_pic.py'
              - 'scripts/test_blueprint_pdf_capacity.py'
              - 'scripts/test_tenkz_equation_web.py'
              - 'scripts/test_tenkz_inline_web.py'
              - 'scripts/test_tenkz_peps_torus.py'
              - 'scripts/test_tenkz_canonical_pairs.py'
              - 'scripts/test_tenkz_peps_groundstate.py'
              - 'scripts/test_tenkz_peps_parent_spanning.py'
              - 'scripts/test_tenkz_peps_native_semiregular.py'
              - 'scripts/test_tenkz_peps_four_cut.py'
              - 'scripts/test_tenkz_peps_three_block.py'
              - 'scripts/test_tenkz_peps_parent_seams.py'
              - 'scripts/test_tenkz_peps_regular_reblocking.py'
              - 'scripts/test_tenkz_quantum_double_local_terms.py'
              - 'scripts/test_tenkz_quantum_double_source_construction.py'
              - 'scripts/check_peps_three_block_blueprint.py'
              - 'docs/audits/2026-10-05_scp10_three_block_blueprint_inventory.json'
              - 'scripts/check_peps_four_cut_blueprint.py'
              - 'docs/audits/2026-10-05_scp10_four_cut_blueprint_inventory.json'
              - 'scripts/test_tenkz_index_routing.py'
              - 'scripts/test_supported_polar_tree.py'
              - 'scripts/test_sector_encoder_diagram.py'
              - 'scripts/test_tenkz_ordered_mixing.py'
              - 'scripts/test_tenkz_sector_weight.py'
              - 'scripts/test_tenkz_string_endpoints.py'
            # Everything the paper-gap reference check reads: the notes,
            # the trees it scans for references, its configuration, and
            # the wrapper scripts.
            paper_gaps:
              - 'docs/paper-gaps/**'
              - 'Papers/1606.00608/**'
              - 'Papers/2502.20257/**'
              - 'scripts/generate_paper_aux.sh'
              - '**.lean'
              - 'blueprint/src/**'
              - 'blueprint/comments/**'
              - 'docs/**/*.md'
              - 'texra-blueprint.toml'
              - 'scripts/paper_gap_leanid_sync.py'
              - 'scripts/test_paper_gap_leanid_sync.py'
            workflow:
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  build:
    needs: changes
    outputs:
      compilation-time-result: ${{ steps.compilation-time.outputs.result }}
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.blueprint == 'true' ||
        needs.changes.outputs.paper_gaps == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Lean build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Report exact-input cache lookup
        env:
          PRIMARY_KEY: ${{ steps.build-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          printf 'cache-primary-key=%s\ncache-matched-key=%s\n' "$PRIMARY_KEY" "$MATCHED_KEY"

      # cache-hit=false also means a successful restore-prefix hit. Only an
      # EMPTY matched key is a miss; never overwrite an ordinary restored cache.
      - name: Select compatible main cache configuration
        id: compatible-config
        if: steps.build-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/ci_compatible_cache.py prepare \
            --state "$RUNNER_TEMP/compatible-cache.json" \
            --inputs .ci-cache-baseline \
            --qic "$RUNNER_TEMP/compatible-cache-qic.git"

      - name: Look up compatible main cache without restoring
        id: compatible-lookup
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-config.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          # hashFiles computes the baseline's complete original three-file hash.
          key: tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-${{ steps.compatible-config.outputs.baseline }}
          restore-keys: |
            tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-
          lookup-only: true

      - name: Select a validated exact compatible cache
        id: compatible-cache
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-lookup.outputs.cache-matched-key != ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          PREFIX: tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-
          MATCHED_KEY: ${{ steps.compatible-lookup.outputs.cache-matched-key }}
          PRIMARY_KEY: ${{ steps.compatible-lookup.outputs.cache-primary-key }}
        run: |
          printf 'cache-primary-key=%s\ncache-matched-key=%s\n' "$PRIMARY_KEY" "$MATCHED_KEY"
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/ci_compatible_cache.py select \
            --state "$RUNNER_TEMP/compatible-cache.json" \
            --prefix "$PREFIX" --matched "$MATCHED_KEY"

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      # Setup/Mathlib prebuilt retrieval happens before this separate seed;
      # no seeded artifact is available to a Lean command until pruning passes.
      - name: Restore validated compatible cache by exact key
        id: compatible-restore
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-cache.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.compatible-cache.outputs.key }}
          fail-on-cache-miss: true

      - name: Discard unvalidated cross-commit artifacts
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-cache.outputs.key != ''
        env:
          PRIMARY_KEY: ${{ steps.compatible-restore.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.compatible-restore.outputs.cache-matched-key }}
          VERIFIED_KEY: ${{ steps.compatible-cache.outputs.key }}
          VERIFIED_VERSION: ${{ steps.compatible-cache.outputs.version }}
          PREFIX: tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-
        run: |
          printf 'cache-primary-key=%s\ncache-matched-key=%s\n' "$PRIMARY_KEY" "$MATCHED_KEY"
          test "$MATCHED_KEY" = "$VERIFIED_KEY"
          # Check scope again after restore; refuse a shadow/replacement race.
          python3 scripts/ci_compatible_cache.py validate \
            --state "$RUNNER_TEMP/compatible-cache.json" \
            --prefix "$PREFIX" --matched "$MATCHED_KEY" --version "$VERIFIED_VERSION"
          python3 scripts/ci_compatible_cache.py prune

      # Cache setup and provenance guards above must finish before Lean runs.
      - name: Check finite rectangular dual geometry early
        run: |
          set -eo pipefail
