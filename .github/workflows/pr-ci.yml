name: PR CI

# The pull-request pipeline, kept light: every push to a pull request
# compiles the Lean modules it changed (within a time budget), runs the style
# linters and the source-level policy and blueprint checks, and nothing else.
# The full library build, the compiled declaration checks, the blueprint web
# and PDF builds and the browser tests run once a night in nightly.yml, and
# nightly-fix.yml repairs what they find. See docs/ci-automation.md.
#
# One workflow means one completion event for the auto-fix dispatcher and
# per-job change gating: Lean-only changes skip the blueprint lint.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/paper-gaps/**/*.tex'
      - 'docs/paper-gaps/**/*.bib'
      - 'texra-blueprint.toml'
      - 'scripts/generate_import_aggregators.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_generate_import_aggregators.py'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on PRs that only touch a scanned file.
      - 'blueprint/comments/**'
      - 'docs/**/*.md'
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_import_layers.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/check_pass_through_declarations.py'
      - 'scripts/check_small_lean_modules.py'
      - 'scripts/small_lean_module_ceilings.txt'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'docbuild/**'
      - 'scripts/check_docbuild_manifest.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/ci_lean_checks.py'
      - 'scripts/test_ci_lean_checks.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/lake_build_locked.sh'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'scripts/ci_compatible_cache.py'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'tenkz.toml'
      - 'scripts/fetch_tenkz.py'
      - 'scripts/tenkz_paths.py'
      - 'scripts/prune_tenkz_render_cache.py'
      - 'blueprint/src/**'
      - 'scripts/build_blueprint_ch01_12.sh'
      - 'docs/slides/**'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/latexindent'
      - 'scripts/check_latexindent_formatting.sh'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_lean_sync.py'
      - 'scripts/paper_gap_leanid_sync.py'
      - 'scripts/test_paper_gap_leanid_sync.py'
      - 'scripts/badge_utils.py'
      - 'scripts/write_badges.py'
      - 'scripts/generate_badges.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/test_blueprint_graph_worker.py'
      - 'scripts/test_blueprint_graph_precompute.py'
      - 'scripts/add_blueprint_search.py'
      - 'scripts/test_add_blueprint_search.py'
      - 'scripts/test_blueprint_search_web.py'
      - 'Papers/1606.00608/**'
      - 'Papers/2502.20257/**'
      - 'scripts/generate_paper_aux.sh'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_*.py'
      - 'scripts/test_*_diagram.py'
      - 'scripts/run_diagram_tests.py'
      - 'scripts/test_run_diagram_tests.py'
      - 'scripts/test_tenkz_equation_web.py'
      - 'scripts/test_tenkz_inline_web.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-cache policy: the cache is saved only by the nightly build of main
# (nightly.yml) and restored everywhere. lean-action's built-in GitHub cache is disabled because it
# saved a ~2.4 GB entry per PR run; those entries cycled through the 10 GB
# repository cache budget within minutes, evicting main's entry, so no run
# ever restored usable TNLean oleans and every run rebuilt all modules.
# Mathlib and its dependencies are intentionally excluded from the cache:
# `lake exe cache get` (run inside lean-action) restores them faster than
# a GitHub cache of that size could.
env:
  BUILD_CACHE_PATHS: |
    .lake/build
    .lake/packages/Gametheory/.lake/build
    .lake/packages/checkdecls/.lake/build
    .lake/packages/qiclean/.lake/build
    .lake/packages/cslib/.lake/build

jobs:
  # Per-job change gating. Dispatch runs skip this and run every job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
      module_policy: ${{ steps.filter.outputs.module_policy }}
      blueprint: ${{ steps.filter.outputs.blueprint }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lean:
              - '**.lean'
              - 'lakefile.*'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'scripts/LintStyle.lean'
              - 'scripts/nolints-style.txt'
              - 'scripts/ci_compatible_cache.py'
              - 'scripts/ci_lean_checks.py'
            module_policy:
              - 'scripts/check_import_layers.py'
              - 'scripts/check_oversized_lean_files.py'
              - 'scripts/check_pass_through_declarations.py'
              - 'scripts/check_small_lean_modules.py'
              - 'scripts/small_lean_module_ceilings.txt'
              - 'scripts/lean_import_syntax.py'
              - 'scripts/test_lean_file_policies.py'
              - 'docbuild/**'
              - 'scripts/check_docbuild_manifest.py'
              - 'scripts/lake_build_hotspots.py'
              - 'scripts/ci_lean_checks.py'
              - 'scripts/test_ci_lean_checks.py'
              - 'scripts/test_lake_build_hotspots.py'
              - 'scripts/lake_build_locked.sh'
              - 'scripts/seed_lake_build.sh'
              - 'scripts/test_seed_lake_build.sh'
              - 'scripts/ci_compatible_cache.py'
              - 'docs/ci-automation.md'
              - 'docs/CONTRIBUTING.md'
              - 'scripts/generate_import_aggregators.py'
              - 'scripts/test_generate_import_aggregators.py'
            blueprint:
              # Dependency upgrades must recheck the blueprint declaration tags.
              - 'lean-toolchain'
              - 'lakefile.*'
              - 'lake-manifest.json'
              - 'docbuild/**'
              - 'blueprint/src/**'
              - 'texra-blueprint.toml'
              - 'tenkz.toml'
              - 'scripts/fetch_tenkz.py'
              - 'scripts/tenkz_paths.py'
              - 'scripts/prune_tenkz_render_cache.py'
              - 'docs/slides/**'
              - 'blueprint/.chktexrc'
              - 'blueprint/latexindent.yaml'
              - 'scripts/latexindent'
              - 'scripts/check_latexindent_formatting.sh'
              - 'scripts/badge_utils.py'
              - 'scripts/write_badges.py'
              - 'scripts/generate_badges.py'
              - 'scripts/test_blueprint_web_render.py'
              - 'scripts/test_blueprint_graph_worker.py'
              - 'scripts/test_blueprint_graph_precompute.py'
              - 'scripts/add_blueprint_search.py'
              - 'scripts/test_add_blueprint_search.py'
              - 'scripts/test_blueprint_search_web.py'
              - 'scripts/tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_*.py'
              - 'scripts/test_*_diagram.py'
              - 'scripts/run_diagram_tests.py'
              - 'scripts/test_run_diagram_tests.py'
              - 'scripts/test_tenkz_equation_web.py'
              - 'scripts/test_tenkz_inline_web.py'
            workflow:
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  build:
    needs: changes
    outputs:
      compilation-time-result: ${{ steps.compilation-time.outputs.result }}
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    # The two changed-module steps stop themselves at their budgets; this
    # bound only catches a hung setup.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Read only: the nightly build of main saves this cache (nightly.yml).
      - name: Restore Lean build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Report exact-input cache lookup
        env:
          PRIMARY_KEY: ${{ steps.build-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          printf 'cache-primary-key=%s\ncache-matched-key=%s\n' "$PRIMARY_KEY" "$MATCHED_KEY"

      # cache-hit=false also means a successful restore-prefix hit. Only an
      # EMPTY matched key is a miss; never overwrite an ordinary restored cache.
      - name: Select compatible main cache configuration
        id: compatible-config
        if: steps.build-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/ci_compatible_cache.py prepare \
            --state "$RUNNER_TEMP/compatible-cache.json" \
            --inputs .ci-cache-baseline \
            --qic "$RUNNER_TEMP/compatible-cache-qic.git"

      - name: Look up compatible main cache without restoring
        id: compatible-lookup
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-config.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          # hashFiles computes the baseline's complete original three-file hash.
          key: tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-${{ steps.compatible-config.outputs.baseline }}
          restore-keys: |
            tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-
          lookup-only: true

      - name: Select a validated exact compatible cache
        id: compatible-cache
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-lookup.outputs.cache-matched-key != ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          PREFIX: tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-
          MATCHED_KEY: ${{ steps.compatible-lookup.outputs.cache-matched-key }}
          PRIMARY_KEY: ${{ steps.compatible-lookup.outputs.cache-primary-key }}
        run: |
          printf 'cache-primary-key=%s\ncache-matched-key=%s\n' "$PRIMARY_KEY" "$MATCHED_KEY"
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/ci_compatible_cache.py select \
            --state "$RUNNER_TEMP/compatible-cache.json" \
            --prefix "$PREFIX" --matched "$MATCHED_KEY"

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      # Setup/Mathlib prebuilt retrieval happens before this separate seed;
      # no seeded artifact is available to a Lean command until pruning passes.
      - name: Restore validated compatible cache by exact key
        id: compatible-restore
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-cache.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.compatible-cache.outputs.key }}
          fail-on-cache-miss: true

      - name: Discard unvalidated cross-commit artifacts
        if: steps.build-cache.outputs.cache-matched-key == '' && steps.compatible-cache.outputs.key != ''
        env:
          PRIMARY_KEY: ${{ steps.compatible-restore.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.compatible-restore.outputs.cache-matched-key }}
          VERIFIED_KEY: ${{ steps.compatible-cache.outputs.key }}
          VERIFIED_VERSION: ${{ steps.compatible-cache.outputs.version }}
          PREFIX: tnlean-build-${{ hashFiles('.ci-cache-baseline/lean-toolchain', '.ci-cache-baseline/lake-manifest.json', '.ci-cache-baseline/lakefile.toml') }}-
        run: |
          printf 'cache-primary-key=%s\ncache-matched-key=%s\n' "$PRIMARY_KEY" "$MATCHED_KEY"
          test "$MATCHED_KEY" = "$VERIFIED_KEY"
          # Check scope again after restore; refuse a shadow/replacement race.
          python3 scripts/ci_compatible_cache.py validate \
            --state "$RUNNER_TEMP/compatible-cache.json" \
            --prefix "$PREFIX" --matched "$MATCHED_KEY" --version "$VERIFIED_VERSION"
          python3 scripts/ci_compatible_cache.py prune

      # Elaborate the PR's direct edits with warnings as errors. Selection
      # uses the explicit feature head, while checks use this merged checkout.
      # A failure it finds fails the job; past its 25-minute budget (a cold
      # dependency cache after a pin change, or a change near the bottom of
      # the import graph) it stops with a warning and leaves the remaining
      # files to the nightly build. Modules that import the changed ones are
      # not rebuilt here at all: the nightly root build is their check.
      - name: Check directly changed Lean sources strictly
        if: github.event_name == 'pull_request'
        timeout-minutes: 30
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          for revision in "$BASE_SHA" "$PR_HEAD_SHA"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$revision"
            fi
            git cat-file -e "$revision^{commit}"
          done
          python3 scripts/ci_lean_checks.py focused \
            --base "$BASE_SHA" --head "$PR_HEAD_SHA" --jobs 3 --budget 1500 \
            --log "$RUNNER_TEMP/lake-build.log"

      # Build the changed production modules, logging the timings that the
      # compilation-time gate below reads. Past its 15-minute budget the
      # build stops with a warning and the nightly build covers the rest.
      # Selection: scripts/ci_lean_checks.py.
      - name: Build changed Lean modules early
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || BASE_SHA=""
          fi
          python3 scripts/ci_lean_checks.py early --budget 900 --log "$RUNNER_TEMP/lake-build.log"

      - name: Check changed Lean compilation times
        id: compilation-time
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          timing_status=0
          archive_build_failed=false
          # No changed production module means no build log yet.
          touch "$RUNNER_TEMP/lake-build.log"
          # Compare the verified tested merge against its actual first parent.
          python3 scripts/lake_build_hotspots.py select-pr \
            --head "$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/changed-lean-files.txt" || timing_status=$?
          if [ "$timing_status" -eq 0 ]; then
            while IFS= read -r path; do
              case "$path" in
                # Keep this aligned with EXCLUDED_TOP_LEVEL_DIRECTORIES in
                # scripts/generate_import_aggregators.py.
                TNLean/Archive/*.lean)
                  module="${path%.lean}"
                  module="${module//\//.}"
                  lake build "$module" 2>&1 \
                    | tee -a "$RUNNER_TEMP/lake-build.log" \
                    || {
                      timing_status=$?
                      archive_build_failed=true
                    }
                  ;;
              esac
              [ "$timing_status" -eq 0 ] || break
            done < "$RUNNER_TEMP/changed-lean-files.txt"
          fi
          if [ "$timing_status" -eq 0 ]; then
            python3 scripts/lake_build_hotspots.py \
              "$RUNNER_TEMP/lake-build.log" \
              --changed-files-from "$RUNNER_TEMP/changed-lean-files.txt" \
              || timing_status=$?
          fi
          case "$timing_status" in
            0) result=success ;;
            50) result=limit ;;
            *) result=error ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$archive_build_failed" = true ]; then
            exit 1
          fi

      # The text-based linter reads sources only, so it needs its own small
      # executable and no build of the library.
      - name: Run text-based style linter
        run: |
          lake build lint_style
          lake exe lint_style --github

  compile-time:
    name: Check changed Lean compilation times
    needs: [changes, build]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce changed-module timing limit
        env:
          TIMING_RESULT: ${{ needs.build.outputs.compilation-time-result }}
        run: |
          case "$TIMING_RESULT" in
            success) ;;
            limit)
              echo "::error::A changed Lean module reached the 50-second compilation limit"
              exit 1
              ;;
            *)
              echo "::error::The changed-module compilation-time checker failed"
              exit 1
              ;;
          esac

  file-length:
    name: Check Lean module policies
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.module_policy == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Formerly the separate import-completeness.yml workflow.
      - name: Test import-aggregator generator
        run: PYTHONPATH=scripts python3 scripts/test_generate_import_aggregators.py -v

      - name: Check generated import aggregators
        run: PYTHONPATH=scripts python3 scripts/generate_import_aggregators.py --check

      - name: Test Lean module-policy checkers
        run: PYTHONPATH=scripts python3 scripts/test_lean_file_policies.py -v

      - name: Test Lean compilation-time checker
        run: python3 scripts/test_lake_build_hotspots.py

      - name: Test changed-file Lean check selection
        run: python3 scripts/test_ci_lean_checks.py

      - name: Check local cache-seeding shell syntax
        run: |
          bash -n scripts/lake_build_locked.sh
          bash -n scripts/seed_lake_build.sh
          bash -n scripts/test_seed_lake_build.sh

      # docbuild/ shares the root package directory, so its manifest must pin
      # the same revisions or the weekly API docs build checks out stale ones.
      - name: Check docbuild manifest against the root manifest
        run: python3 scripts/check_docbuild_manifest.py --root .

      # The repository keeps no Lean test fixtures (per-theorem axiom
      # printouts and the like) under TNLeanTest/; see
      # docs/project_conventions.md.
      - name: Reject test fixture files
        run: |
          files=$(git ls-files -- TNLeanTest)
          if [ -n "$files" ]; then
            printf '::error file=%s::Do not add files under TNLeanTest/; see docs/project_conventions.md.\n' $files
            exit 1
          fi

      # Ordinary Lean modules over 1000 lines fail. The exact root aggregator
      # exemption is accepted only while its uncommented content is import-only.
      - name: Run oversized-file guard
        run: >
          PYTHONPATH=scripts python3 scripts/check_oversized_lean_files.py
          --root .
          --import-only-aggregator TNLean.lean

      - name: Fetch pull-request base for the debt ratchet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      # Imports between the layers below the tensor-network directories must
      # point downward, no new pair of directories may import each other, no
      # library module may newly import a worked example, no declaration may
      # newly restate another one under a second name, and no directory
      # may hold more modules of at most two public declarations than its
      # ceiling. The recorded violations and ceilings may only shrink against
      # the base; see docs/many_body_circuit_architecture.md and
      # docs/ci-automation.md.
      - name: Check import layers, pass-throughs and small modules
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$BASE_REF" ;;
            push) base="$EVENT_BEFORE" ;;
            *) base="HEAD^" ;;
          esac
          python3 scripts/check_import_layers.py --root . --base-ref "$base"
          python3 scripts/check_pass_through_declarations.py --root . --base-ref "$base"
          python3 scripts/check_small_lean_modules.py --root . --base-ref "$base"

  blueprint:
    # Source-level checks only: picture and LaTeX lint, formatting, and the
    # agreement of the blueprint's declaration tags with the Lean sources.
    # Nothing here compiles TeX; the web and PDF builds, the diagram and
    # browser tests and the paper-gap reference check run in nightly.yml.
    name: Check blueprint sources
    needs: changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.result == 'success')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This SHA belongs to the checked-out PR merge, even if its base branch advances.
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      # The lint steps run only when blueprint sources changed (always on
      # dispatch); the Lean-blueprint sync checks run on Lean-only changes too.
      TEX_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.blueprint == 'true' || needs.changes.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch immutable PR base for blueprint comparisons
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Fetch pinned tenkz package
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/fetch_tenkz.py

      - name: Detect changed Lean files
        id: changed-lean-files
        if: github.event_name == 'pull_request'
        run: |
          changed_lean_paths="$(git diff --name-only "$BASE_REF" HEAD -- \
            TNLean.lean 'TNLean/**/*.lean' lakefile.* lean-toolchain lake-manifest.json)"
          if [ -n "$changed_lean_paths" ]; then
            has_changed_lean=true
          else
            has_changed_lean=false
            # Inspect both sides of renames, including removed declaration markers.
            # Capture the diff before iterating so a Git error fails the step.
            changed_tex_paths="$(git diff --no-renames --name-only "$BASE_REF" HEAD -- \
              'blueprint/src/**/*.tex' 'blueprint/src/*.tex')"
            while IFS= read -r tex_file; do
              [ -n "$tex_file" ] || continue
              if [ -f "$tex_file" ] && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' "$tex_file"; then
                has_changed_lean=true
                break
              fi
              # Added paths have no base blob; failures reading existing blobs
              # must not silently remove declaration coverage.
              base_tex_path="$(git ls-tree --name-only "$BASE_REF" -- "$tex_file")"
              base_tex=""
              if [ -n "$base_tex_path" ]; then
                base_tex="$(git show "$BASE_REF:$tex_file")"
              fi
              if [ -n "$base_tex" ] \
                  && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' <<< "$base_tex"; then
                has_changed_lean=true
                break
              fi
            done <<< "$changed_tex_paths"
          fi
          echo "has_changed_lean=$has_changed_lean" >> "$GITHUB_OUTPUT"

      # chktex alone, not the TeX distribution the nightly builds install.
      - name: Install chktex
        if: env.TEX_CHANGED == 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chktex

      - name: Lint tenkz picture sources
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 .deps/tenkz/scripts/tenkz_lint.py \
            'blueprint/src/chapter/*.tex' \
            'blueprint/src/figures/*.tex' \
            'docs/slides/*.tex'

      - name: Lint LaTeX (chktex)
        if: env.TEX_CHANGED == 'true'
        run: |
          find blueprint/src -name '*.tex' -not -path '*/Packages/*' -print0 \
            | xargs -0 -r chktex -q -l blueprint/.chktexrc

      # Formats temporary copies in parallel and compares bytes; see the
      # script for why -w mode is used instead of -k.
      - name: Check LaTeX formatting (latexindent)
        if: env.TEX_CHANGED == 'true'
        timeout-minutes: 5
        run: scripts/check_latexindent_formatting.sh

      - name: Test Blueprint declaration scanner
        run: python3 scripts/test_blueprint_lean_sync.py

      - name: Test paper-gap Lean declaration scanner
        run: PYTHONPATH=scripts python3 scripts/test_paper_gap_leanid_sync.py

      - name: Generate lean_decls from blueprint .tex files
        id: lean-decls
        env:
          BLUEPRINT_SYNC_FETCH_DEPS: '1'
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check blueprint and Lean source stay in sync
        if: steps.lean-decls.outcome == 'success'
        env:
          BLUEPRINT_SYNC_FETCH_DEPS: '1'
        run: python3 scripts/blueprint_lean_sync.py --root . --ci --report-duplicate-tags

      - name: Verify immutable PR base for diff
        id: fetch-base-ref
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        run: |
          git cat-file -e "$BASE_REF^{commit}"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Error on changed Lean declarations missing blueprint entries
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base_ref = os.environ["BASE_REF"]

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=AMR",
                  base_ref,
                  "HEAD",
                  "--",
                  "TNLean.lean",
                  "TNLean/**/*.lean",
              ],
              text=True,
          )
          changed_lean_files = [line for line in changed.splitlines() if line.endswith(".lean")]

          if not changed_lean_files:
              print("No changed TNLean/*.lean files in this pull request.")
              raise SystemExit(0)

          subprocess.run(
              [
                  "python3",
                  "scripts/blueprint_lean_sync.py",
                  "--root",
                  ".",
                  "--warn-missing-blueprint",
                  "--diff-base",
                  base_ref,
                  "--changed-files",
                  *changed_lean_files,
              ],
              check=True,
          )
          PY
