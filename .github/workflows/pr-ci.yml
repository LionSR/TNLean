          for example in ExactTreeRepresentation SquareLatticeConnectivity \
              ExactTreeRepresentationAxioms ExactSmallSizeApproximation ExactFiniteException; do
            lake env lean \
              -DautoImplicit=false -DrelaxedAutoImplicit=false -Dpp.unicode.fun=true \
              -DmaxSynthPendingDepth=3 -Dlinter.mathlibStandardSet=true -DwarningAsError=true \
              "TNLeanTest/PEPS/Approximation/$example.lean"
          done

      - name: Test algebraic preparation import boundary
        timeout-minutes: 2
        run: >
          lake env lean
          -DautoImplicit=false -DrelaxedAutoImplicit=false -Dpp.unicode.fun=true
          -DmaxSynthPendingDepth=3 -Dlinter.mathlibStandardSet=true -DwarningAsError=true
          TNLeanTest/PreparationAlgebraBoundary.lean

      - name: Test area-law foundations and physical oscillations
        timeout-minutes: 2
        run: |
          set -e
          for example in AreaLawGraphFoundations AreaLawLatticeDiamond \
              AreaLawInteractionDiamond AreaLawInteractionTarget AreaLawInteractionSeries; do
            lake env lean \
              -DautoImplicit=false -DrelaxedAutoImplicit=false -Dpp.unicode.fun=true \
              -DmaxSynthPendingDepth=3 -Dlinter.mathlibStandardSet=true -DwarningAsError=true \
              "TNLeanTest/$example.lean"
          done
          for file in scripts/spectator_site_expectation_regression.lean \
              TNLeanTest/SiteOscillation.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/LocalRootChannels.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/LocalRootChannelsAxioms.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/ChannelShellOscillation.lean \
              TNLeanTest/Circuit/LiebRobinson/GraphBallStabilization.lean \
              TNLeanTest/SpectatorOscillationSupport.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/LocalChannelOscillation.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/ExponentialChannelShells.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/ComponentChannelOscillation.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/GraphChannelOscillation.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/GraphChannelEventKernel.lean \
              TNLeanTest/PEPS/AreaLaw/Amplification/GraphChannelWeightedRow.lean; do
            lake env lean \
              -DautoImplicit=false -DrelaxedAutoImplicit=false -Dpp.unicode.fun=true \
              -DmaxSynthPendingDepth=3 -Dlinter.mathlibStandardSet=true -DwarningAsError=true \
              "$file"
          done

      - name: Check changed Lean compilation times
        id: compilation-time
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          timing_status=0
          archive_build_failed=false
          git fetch --no-tags origin "$BASE_REF" || timing_status=$?
          if [ "$timing_status" -eq 0 ]; then
            git merge-base --is-ancestor "$BASE_REF" HEAD || timing_status=$?
          fi
          if [ "$timing_status" -eq 0 ]; then
            git -c core.quotePath=false diff \
              --name-only --diff-filter=AMR "$BASE_REF" HEAD -- '*.lean' \
              > "$RUNNER_TEMP/changed-lean-files.txt" \
              || timing_status=$?
          fi
          if [ "$timing_status" -eq 0 ]; then
            while IFS= read -r path; do
              case "$path" in
                # Keep this aligned with EXCLUDED_TOP_LEVEL_DIRECTORIES in
                # scripts/generate_import_aggregators.py.
                TNLean/Archive/*.lean)
                  module="${path%.lean}"
                  module="${module//\//.}"
                  lake build "$module" 2>&1 \
                    | tee -a "$RUNNER_TEMP/lake-build.log" \
                    || {
                      timing_status=$?
                      archive_build_failed=true
                    }
                  ;;
              esac
              [ "$timing_status" -eq 0 ] || break
            done < "$RUNNER_TEMP/changed-lean-files.txt"
          fi
          if [ "$timing_status" -eq 0 ]; then
            python3 scripts/lake_build_hotspots.py \
              "$RUNNER_TEMP/lake-build.log" \
              --changed-files-from "$RUNNER_TEMP/changed-lean-files.txt" \
              || timing_status=$?
          fi
          case "$timing_status" in
            0) result=success ;;
            50) result=limit ;;
            *) result=error ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$archive_build_failed" = true ]; then
            exit 1
          fi

      - name: Run text-based style linter
        run: lake exe lint_style --github

      # `checkdecls` imports TNLean modules to resolve every tagged declaration,
      # so it must run after the project build rather than in the TeX-only job.
      - name: Generate Blueprint Lean declaration list
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check Blueprint Lean declarations
        timeout-minutes: 10
        run: lake exe checkdecls blueprint/lean_decls

      - name: Generate paper-gap Lean declaration list
        run: python3 scripts/paper_gap_leanid_sync.py --root . --output "$RUNNER_TEMP/paper_gap_leanid_decls"

      - name: Check paper-gap Lean declarations
        timeout-minutes: 10
        run: lake exe checkdecls "$RUNNER_TEMP/paper_gap_leanid_decls"

      # A cancelled or failed build can leave partially written `.olean` files.
      # Restore only caches saved after the complete build and style checks pass.
      - name: Save Lean build cache (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

  compile-time:
    name: Check changed Lean compilation times
    needs: [changes, build]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce changed-module timing limit
        env:
          TIMING_RESULT: ${{ needs.build.outputs.compilation-time-result }}
        run: |
          case "$TIMING_RESULT" in
            success) ;;
            limit)
              echo "::error::A changed Lean module reached the 50-second compilation limit"
              exit 1
              ;;
            *)
              echo "::error::The changed-module compilation-time checker failed"
              exit 1
              ;;
          esac

  file-length:
    name: Check Lean module policies
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.module_policy == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test Lean module-policy checkers
        run: PYTHONPATH=scripts python3 scripts/test_lean_file_policies.py -v

      - name: Test Lean compilation-time checker
        run: python3 scripts/test_lake_build_hotspots.py

      - name: Test bounded coherent prerequisite export
        run: |
          python3 scripts/test_export_coherent_qic_prerequisites.py
          python3 scripts/test_export_coherent_tn_prerequisites.py

      - name: Test compatible CI cache guards
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/test_ci_compatible_cache.py
          python3 scripts/test_pr_ci_base_snapshot.py
          python3 -m py_compile scripts/test_ci_cache_lake_invalidation.py

      - name: Test CI fixture import overlay
        run: python3 scripts/test_ci_fixture_overlay.py

      - name: Check local cache-seeding shell syntax
        run: |
          bash -n scripts/lake_build_locked.sh
          bash -n scripts/seed_lake_build.sh
          bash -n scripts/test_seed_lake_build.sh

      # docbuild/ shares the root package directory, so its manifest must pin
      # the same revisions or the weekly API docs build checks out stale ones.
      - name: Check docbuild manifest against the root manifest
        run: python3 scripts/check_docbuild_manifest.py --root .

      # Ordinary Lean modules over 1000 lines fail. The exact root aggregator
      # exemption is accepted only while its uncommented content is import-only.
      - name: Run oversized-file guard
        run: >
          PYTHONPATH=scripts python3 scripts/check_oversized_lean_files.py
          --root .
          --import-only-aggregator TNLean.lean

      - name: Fetch pull-request base for the debt ratchet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Reject new numbered-sequel modules (pull request)
        if: github.event_name == 'pull_request'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref "$BASE_REF"

      - name: Reject new numbered-sequel modules (push)
        if: github.event_name == 'push'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref "${{ github.event.before }}"

      - name: Reject new numbered-sequel modules (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref HEAD^

  inline-layout:
    name: Check inline diagram semantics
    needs: changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.blueprint == 'true' || needs.changes.outputs.workflow == 'true')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser and browser
        run: |
          python3 -m pip install plasTeX==3.1 playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test inline picture semantics
        run: python3 scripts/test_tenkz_inline_web.py

      - name: Diagnose full TeX system environment
        timeout-minutes: 20
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers
      - name: Check layout with TeX system dependencies
        run: |
          fc-match 'Times New Roman'
          python3 scripts/test_tenkz_inline_web.py
      - name: Diagnose full blueprint Python environment
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'
      - name: Check layout with blueprint Python dependencies
        run: python3 scripts/test_tenkz_inline_web.py

  blueprint:
    name: Check blueprint compiles without errors
    needs: changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.result == 'success')"
    runs-on: ubuntu-latest
    env:
      # This SHA belongs to the checked-out PR merge, even if its base branch advances.
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      # TeX-facing steps run only when blueprint sources changed (always on
      # push/dispatch); the Lean-blueprint sync checks run on Lean-only
      # changes too.
      TEX_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.blueprint == 'true' || needs.changes.outputs.workflow == 'true' }}
      # The paper-gap reference check also runs when only the notes, the
      # Lean sources, the Markdown docs, or the generator changed.
      PAPER_GAPS_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.paper_gaps == 'true' || needs.changes.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch immutable PR base for blueprint comparisons
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Test tenkz render-cache pruning
        run: python3 scripts/test_prune_tenkz_render_cache.py

      # Run on Lean-only changes as well: these checks exercise the supported
      # polar-merge algebra in addition to its typed diagram boundaries.
      - name: Test supported polar trees and diagram boundaries
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          python3 scripts/test_supported_polar_tree.py

      - name: Test blueprint search preparation
        run: python3 scripts/test_add_blueprint_search.py

      - name: Fetch pinned tenkz package
        run: python3 scripts/fetch_tenkz.py

      - name: Validate CPSV16 every-label audit
        run: |
          python3 scripts/test_audit_cpsv16_labels.py
          python3 scripts/audit_cpsv16_labels.py

      - name: Check reader-facing prose patterns
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_reader_facing_prose.py --root . --diff-base "$BASE_REF" --ci

      - name: Detect changed Lean files
        id: changed-lean-files
        if: github.event_name == 'pull_request'
        run: |
          changed_lean_paths="$(git diff --name-only "$BASE_REF" HEAD -- \
            TNLean.lean 'TNLean/**/*.lean' lakefile.* lean-toolchain lake-manifest.json)"
          if [ -n "$changed_lean_paths" ]; then
            has_changed_lean=true
          else
            has_changed_lean=false
            # Inspect both sides of renames, including removed declaration markers.
            # Capture the diff before iterating so a Git error fails the step.
            changed_tex_paths="$(git diff --no-renames --name-only "$BASE_REF" HEAD -- \
              'blueprint/src/**/*.tex' 'blueprint/src/*.tex')"
            while IFS= read -r tex_file; do
              [ -n "$tex_file" ] || continue
              if [ -f "$tex_file" ] && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' "$tex_file"; then
                has_changed_lean=true
                break
              fi
              # Added paths have no base blob; failures reading existing blobs
              # must not silently remove declaration coverage.
              base_tex_path="$(git ls-tree --name-only "$BASE_REF" -- "$tex_file")"
              base_tex=""
              if [ -n "$base_tex_path" ]; then
                base_tex="$(git show "$BASE_REF:$tex_file")"
              fi
              if [ -n "$base_tex" ] \
                  && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' <<< "$base_tex"; then
                has_changed_lean=true
                break
              fi
            done <<< "$changed_tex_paths"
          fi
          echo "has_changed_lean=$has_changed_lean" >> "$GITHUB_OUTPUT"

      - name: Install blueprint system dependencies
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        timeout-minutes: 20
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      # Also installed for paper-gap-only changes: the reference check
      # below runs the texra-blueprint CLI from this step's pip install.
      - name: Install blueprint Python dependencies
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Lint tenkz picture sources
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 .deps/tenkz/scripts/tenkz_lint.py \
            'blueprint/src/chapter/*.tex' \
            'docs/slides/*.tex'

      - name: Check paper source label generator syntax
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        run: bash -n scripts/generate_paper_aux.sh

      - name: Generate paper source labels
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        run: |
          ./scripts/generate_paper_aux.sh 1606.00608
          ./scripts/generate_paper_aux.sh 2502.20257

      - name: Check paper-gap references resolve
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        run: texra-blueprint paper-gaps check

      - name: Test blueprint PDF string-pool capacity
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_blueprint_pdf_capacity.py

      # Compile-and-cache smoke test of the tenkz picture pipeline
      # (blueprint/src/Packages/tenkz_pic.py): renders the spec benchmark
      # units standalone and checks ink, caching, and per-figure
      # invalidation.
      - name: Smoke-test tenkz picture pipeline
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_pic.py

      - name: Test finite rectangular dual geometry
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_dual_rectangle.py

      - name: Test quantum-double local-term diagrams and nonabelian formulas
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 scripts/test_tenkz_quantum_double_local_terms.py
          python3 scripts/test_tenkz_quantum_double_source_construction.py

      - name: Test source-linked PEPS torus geometry
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_peps_torus.py

      - name: Check PEPS ground-state diagram boundaries
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_peps_groundstate.py

      - name: Check regular parent and intersection diagrams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_peps_parent_spanning.py

      - name: Check native semi-regular parent diagrams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_peps_native_semiregular.py

      - name: Check source four-cut diagrams and declaration coverage
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 scripts/test_tenkz_peps_four_cut.py
          python3 scripts/check_peps_four_cut_blueprint.py
          python3 scripts/test_tenkz_peps_three_block.py
          python3 scripts/test_tenkz_peps_parent_seams.py
          python3 scripts/test_tenkz_peps_regular_reblocking.py
          python3 scripts/check_peps_three_block_blueprint.py

      - name: Test tenkz coefficient-index routing
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_index_routing.py

      - name: Test ordered mixing contraction diagrams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_ordered_mixing.py

      - name: Test the GHZ sector-probability contraction
        if: env.TEX_CHANGED == 'true'
        timeout-minutes: 2
        run: python3 scripts/test_tenkz_sector_weight.py

      - name: Test finite physical string endpoint contractions
        if: env.TEX_CHANGED == 'true'
        timeout-minutes: 2
        run: python3 scripts/test_tenkz_string_endpoints.py

      - name: Check compatible-seed diagram conventions
        run: python3 scripts/test_compatible_seed_diagram.py

      - name: Check coherent sector-encoder diagrams
        run: python3 scripts/test_sector_encoder_diagram.py

      - name: Lint LaTeX (chktex)
        if: env.TEX_CHANGED == 'true'
        run: |
          find blueprint/src -name '*.tex' -not -path '*/Packages/*' -print0 \
            | xargs -0 -r chktex -q -l blueprint/.chktexrc

      # Formats temporary copies in parallel and compares bytes; see the
      # script for why -w mode is used instead of -k.
      - name: Check LaTeX formatting (latexindent)
        if: env.TEX_CHANGED == 'true'
        timeout-minutes: 5
        run: scripts/check_latexindent_formatting.sh

      - name: Build blueprint bibliography
        if: env.TEX_CHANGED == 'true'
        run: texra-blueprint bbl

      # Reuse the pictures the last main build compiled (blueprint.yml saves
      # them); a picture is named by the hash of its source, so only figures
      # this branch edits are compiled again. Read only: branches never save.
      - name: Restore tenkz picture cache
        if: env.TEX_CHANGED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            blueprint/web/tenkz_svg
            blueprint/src/.tenkz_svg_cache
          key: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-${{ github.run_id }}
          restore-keys: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-

      - name: Run texra-blueprint web and check for errors
        if: env.TEX_CHANGED == 'true'
        working-directory: blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          # texra-blueprint web wraps leanblueprint web and fails when the
          # renderer meets a command it does not know (unrecognized
          # command/environment, default-renderer fallback); the log is kept
          # for the label checks below.
          texra-blueprint web 2>&1 | tee "$tmp_output_file"

          # Check for blueprint ERROR lines in the captured output
          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::warning::Blueprint has missing file references (see WARNING lines above)"
          fi

      - name: Prune unused tenkz pictures
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/prune_tenkz_render_cache.py

      - name: Test canonical fixed-point diagrams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_canonical_pairs.py

      - name: Test tenkz blueprint sweep unit selection
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_blueprint_sweep.py

      # Every blueprint picture compiled standalone during the web build and
      # left its event stream in the render cache; the sweep audits all of
      # them, so the boundary-signature rules reach the volume's figures and
      # not only the regression corpus.
      - name: Sweep tenkz blueprint event streams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/tenkz_blueprint_sweep.py

      - name: Test tenkz equation web layout
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_tenkz_equation_web.py --web-root blueprint/web

      - name: Add and test blueprint search
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check 'pagefind[extended]==1.5.2'
          python3 scripts/add_blueprint_search.py --web-root blueprint/web
          python3 scripts/test_blueprint_search_web.py --web-root blueprint/web

      - name: Preserve failed blueprint render
        if: failure() && env.TEX_CHANGED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-render-failure
          path: blueprint/web
          retention-days: 3

      # A zero exit status says the build ran, not that the pages read. This
      # opens every generated page and measures what a reader would meet.
      - name: Test generated blueprint pages
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Test Blueprint declaration scanner
        run: python3 scripts/test_blueprint_lean_sync.py

      - name: Test paper-gap Lean declaration scanner
        run: PYTHONPATH=scripts python3 scripts/test_paper_gap_leanid_sync.py

      - name: Test badge color thresholds
        run: python3 scripts/test_badge_colors.py

      - name: Generate lean_decls from blueprint .tex files
        id: lean-decls
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check blueprint and Lean source stay in sync
        if: steps.lean-decls.outcome == 'success'
        run: python3 scripts/blueprint_lean_sync.py --root . --ci --report-duplicate-tags

      - name: Verify immutable PR base for diff
        id: fetch-base-ref
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        run: |
          git cat-file -e "$BASE_REF^{commit}"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Error on changed Lean declarations missing blueprint entries
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base_ref = os.environ["BASE_REF"]

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=AMR",
                  base_ref,
                  "HEAD",
                  "--",
                  "TNLean.lean",
                  "TNLean/**/*.lean",
              ],
              text=True,
          )
          changed_lean_files = [line for line in changed.splitlines() if line.endswith(".lean")]

          if not changed_lean_files:
              print("No changed TNLean/*.lean files in this pull request.")
              raise SystemExit(0)

          subprocess.run(
              [
                  "python3",
                  "scripts/blueprint_lean_sync.py",
                  "--root",
                  ".",
                  "--warn-missing-blueprint",
                  "--diff-base",
                  base_ref,
                  "--changed-files",
                  *changed_lean_files,
              ],
              check=True,
          )
          PY
