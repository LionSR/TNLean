name: PR CI

# The pull-request pipeline: Lean build + style lint, blueprint lint and
# Lean-blueprint sync, and the Lean module-policy guards, formerly
# lean_action_ci.yml, lint-blueprint.yml, and oversized-lean-files.yml.
# One workflow means one completion event for the auto-fix dispatcher and
# per-job change gating: Lean-only changes skip the TeX pipeline, while
# blueprint changes also run the Lean build for compiled declaration checking.

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'texra-blueprint.toml'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_numbered_lean_files.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/pr-ci.yml'
      - '.github/workflows/tenkz-rmp-book.yml'
      - 'blueprint/src/**'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on merge pushes that only touch a scanned file.
      - 'blueprint/comments/**'
      - 'docs/**/*.md'
      - 'tex/tenkz/**'
      - 'tests/tenkz/**'
      - 'docs/tenkz/**'
      - 'docs/slides/**'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/blueprint_bibtex.py'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/check_reader_facing_prose.py'
      - 'scripts/audit_cpsv16_labels.py'
      - 'scripts/test_audit_cpsv16_labels.py'
      - 'Papers/1606.00608/MPDO-22-12-17-2.tex'
      - 'docs/audits/2026-05-08-mps-ft-paper-coverage.md'
      - 'docs/audits/2026-08-10-cpsv16-every-label-audit.md'
      - 'docs/audits/data/cpsv16-contained-result-anchors.tsv'
      - 'docs/audits/data/cpsv16-label-classifications.tsv'
      - 'docs/audits/data/cpsv16-label-dispositions.tsv'
      - 'scripts/tenkz_audit.py'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_blueprint_sweep.py'
      - 'scripts/tenkz_rmp.py'
      - 'Papers/2011.12127/TN-Review-main.tex'
      - 'scripts/update_tenkz_dimension_inventory.py'
      - 'scripts/tenkzlib/**'
      - 'scripts/tenkz_manual_doctest.py'
      - 'scripts/test_tenkz_manual_doctest.py'
      - 'scripts/tenkz_language.py'
      - 'scripts/tenkz_shrink.py'
      - 'scripts/test_tenkz_shrink.py'
      - 'scripts/tenkz_corpus.sh'
      - 'scripts/tenkz_golden.sh'
      - 'scripts/tenkz_kernel_probes.sh'
      - 'scripts/tenkz_string_probes.sh'
      - 'scripts/tenkz_render_corpus.py'
      - 'scripts/test_tenkz_corpus_provenance.py'
      - 'scripts/test_tenkz_corpus_render.py'
      - 'scripts/test_tenkz_dimension_inventory.py'
      - 'scripts/tenkz_lint.py'
      - 'scripts/test_tenkz_pic.py'
      - 'scripts/test_tenkz_equation_audit.py'
      - 'scripts/test_tenkz_equation_web.py'
      - 'scripts/test_tenkz_label_overlap.py'
      - 'scripts/test_tenkz_peps_torus.py'
      - 'scripts/test_tenkz_cubic.py'
      - 'scripts/test_tenkz_index_routing.py'
      - 'scripts/test_tenkz_tree.py'
      - 'scripts/test_tenkz_kernel_audit.py'
      - 'scripts/test_tnlog.py'
      - 'scripts/test_texcase.py'
      - 'scripts/tenkz_ctan.py'
      - 'scripts/test_tenkz_ctan.py'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/paper-gaps/**/*.tex'
      - 'docs/paper-gaps/**/*.bib'
      - 'texra-blueprint.toml'
      - 'scripts/package-paper-gaps.sh'
      - 'scripts/build-paper-gaps.sh'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on PRs that only touch a scanned file.
      - 'blueprint/comments/**'
      - 'docs/**/*.md'
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/LintStyle.lean'
      - 'scripts/nolints-style.txt'
      - 'scripts/check_numbered_lean_files.py'
      - 'scripts/check_oversized_lean_files.py'
      - 'scripts/lean_import_syntax.py'
      - 'scripts/test_lean_file_policies.py'
      - 'scripts/lake_build_hotspots.py'
      - 'scripts/test_lake_build_hotspots.py'
      - 'scripts/seed_lake_build.sh'
      - 'scripts/test_seed_lake_build.sh'
      - 'docs/ci-automation.md'
      - 'docs/CONTRIBUTING.md'
      - '.github/workflows/pr-ci.yml'
      - '.github/workflows/tenkz-rmp-book.yml'
      - 'blueprint/src/**'
      - 'tex/tenkz/**'
      - 'tests/tenkz/**'
      - 'docs/tenkz/**'
      - 'docs/slides/**'
      - 'blueprint/.chktexrc'
      - 'blueprint/latexindent.yaml'
      - 'scripts/blueprint_bibtex.py'
      - 'scripts/blueprint_lean_sync.py'
      - 'scripts/test_blueprint_web_render.py'
      - 'scripts/check_reader_facing_prose.py'
      - 'scripts/audit_cpsv16_labels.py'
      - 'scripts/test_audit_cpsv16_labels.py'
      - 'Papers/1606.00608/MPDO-22-12-17-2.tex'
      - 'docs/audits/2026-05-08-mps-ft-paper-coverage.md'
      - 'docs/audits/2026-08-10-cpsv16-every-label-audit.md'
      - 'docs/audits/data/cpsv16-contained-result-anchors.tsv'
      - 'docs/audits/data/cpsv16-label-classifications.tsv'
      - 'docs/audits/data/cpsv16-label-dispositions.tsv'
      - 'scripts/tenkz_audit.py'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_blueprint_sweep.py'
      - 'scripts/tenkz_rmp.py'
      - 'Papers/2011.12127/TN-Review-main.tex'
      - 'scripts/update_tenkz_dimension_inventory.py'
      - 'scripts/tenkzlib/**'
      - 'scripts/tenkz_manual_doctest.py'
      - 'scripts/test_tenkz_manual_doctest.py'
      - 'scripts/tenkz_language.py'
      - 'scripts/tenkz_shrink.py'
      - 'scripts/test_tenkz_shrink.py'
      - 'scripts/tenkz_corpus.sh'
      - 'scripts/tenkz_golden.sh'
      - 'scripts/tenkz_kernel_probes.sh'
      - 'scripts/tenkz_string_probes.sh'
      - 'scripts/tenkz_render_corpus.py'
      - 'scripts/test_tenkz_corpus_provenance.py'
      - 'scripts/test_tenkz_corpus_render.py'
      - 'scripts/test_tenkz_dimension_inventory.py'
      - 'scripts/tenkz_lint.py'
      - 'scripts/test_tenkz_pic.py'
      - 'scripts/test_tenkz_equation_audit.py'
      - 'scripts/test_tenkz_equation_web.py'
      - 'scripts/test_tenkz_label_overlap.py'
      - 'scripts/test_tenkz_peps_torus.py'
      - 'scripts/test_tenkz_cubic.py'
      - 'scripts/test_tenkz_index_routing.py'
      - 'scripts/test_tenkz_tree.py'
      - 'scripts/test_tenkz_kernel_audit.py'
      - 'scripts/test_tnlog.py'
      - 'scripts/test_texcase.py'
      - 'scripts/tenkz_ctan.py'
      - 'scripts/test_tenkz_ctan.py'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-cache policy: the cache is saved only from main and restored
# everywhere. lean-action's built-in GitHub cache is disabled because it
# saved a ~2.4 GB entry per PR run; those entries cycled through the 10 GB
# repository cache budget within minutes, evicting main's entry, so no run
# ever restored usable TNLean oleans and every run rebuilt all modules.
# Mathlib and its dependencies are intentionally excluded from the cache:
# `lake exe cache get` (run inside lean-action) restores them faster than
# a GitHub cache of that size could.
env:
  BUILD_CACHE_PATHS: |
    .lake/build
    .lake/packages/Gametheory/.lake/build
    .lake/packages/checkdecls/.lake/build
    .lake/packages/qiclean/.lake/build

jobs:
  # Per-job change gating. Push and dispatch runs skip this and run
  # every job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
      module_policy: ${{ steps.filter.outputs.module_policy }}
      blueprint: ${{ steps.filter.outputs.blueprint }}
      paper_gaps: ${{ steps.filter.outputs.paper_gaps }}
      corpus: ${{ steps.filter.outputs.corpus }}
      shrink: ${{ steps.filter.outputs.shrink }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lean:
              - '**.lean'
              - 'lakefile.*'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'scripts/LintStyle.lean'
              - 'scripts/nolints-style.txt'
            module_policy:
              - 'scripts/check_numbered_lean_files.py'
              - 'scripts/check_oversized_lean_files.py'
              - 'scripts/lean_import_syntax.py'
              - 'scripts/test_lean_file_policies.py'
              - 'scripts/lake_build_hotspots.py'
              - 'scripts/test_lake_build_hotspots.py'
              - 'scripts/seed_lake_build.sh'
              - 'scripts/test_seed_lake_build.sh'
              - 'docs/ci-automation.md'
              - 'docs/CONTRIBUTING.md'
            blueprint:
              - 'blueprint/src/**'
              - 'texra-blueprint.toml'
              - 'tex/tenkz/**'
              - 'docs/tenkz/**'
              - 'docs/slides/**'
              - 'blueprint/.chktexrc'
              - 'blueprint/latexindent.yaml'
              - 'scripts/blueprint_bibtex.py'
              - 'scripts/check_reader_facing_prose.py'
              - 'scripts/test_blueprint_web_render.py'
              - 'scripts/tenkz_audit.py'
              - 'scripts/tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_blueprint_sweep.py'
              - 'scripts/tenkz_rmp.py'
              - 'scripts/tenkzlib/**'
              - 'scripts/tenkz_language.py'
              - 'scripts/tenkz_shrink.py'
              - 'scripts/test_tenkz_shrink.py'
              - 'scripts/tenkz_lint.py'
              - 'scripts/test_tenkz_pic.py'
              - 'scripts/test_tenkz_equation_audit.py'
              - 'scripts/test_tenkz_equation_web.py'
              - 'scripts/test_tenkz_label_overlap.py'
              - 'scripts/test_tenkz_peps_torus.py'
              - 'scripts/test_tenkz_index_routing.py'
              - 'scripts/test_tenkz_tree.py'
              - 'scripts/test_tenkz_kernel_audit.py'
              - 'scripts/test_tnlog.py'
              - 'scripts/test_texcase.py'
            # Everything the paper-gap reference check reads: the notes,
            # the trees it scans for references, its configuration, and
            # the wrapper scripts.
            paper_gaps:
              - 'docs/paper-gaps/**'
              - '**.lean'
              - 'blueprint/src/**'
              - 'blueprint/comments/**'
              - 'docs/**/*.md'
              - 'texra-blueprint.toml'
              - 'scripts/package-paper-gaps.sh'
              - 'scripts/build-paper-gaps.sh'
            corpus:
              - 'tex/tenkz/**'
              - 'tests/tenkz/**'
              - 'docs/tenkz/chapters2/**'
              - 'docs/tenkz/**/*.tex'
              - 'docs/tenkz/manual2.tex'
              - 'docs/tenkz/tenkzmanual2.sty'
              # The kernel probes diff the contract's printed sketches
              # against their fixtures, so contract-side drift must run
              # the corpus job too ('docs/tenkz/**/*.tex' misses a .md).
              - 'docs/tenkz/LANGUAGE-1.0.md'
              # The RMP benchmark book's own style file: a runtime input of
              # `tenkz_rmp.py book --all` (the book driver rmp-benchmark.tex
              # already matches 'docs/tenkz/**/*.tex' above).
              - 'docs/tenkz/tenkzrmpbenchmark.sty'
              - 'scripts/tenkz_manual_doctest.py'
              - 'scripts/test_tenkz_manual_doctest.py'
              - 'scripts/tenkz_audit.py'
              - 'scripts/tenkz_blueprint_sweep.py'
              - 'scripts/test_tenkz_blueprint_sweep.py'
              - 'scripts/tenkz_rmp.py'
              - 'scripts/tenkz_lint.py'
              - 'scripts/tenkz_language.py'
              - 'Papers/2011.12127/TN-Review-main.tex'
              - 'scripts/tenkzlib/**'
              - 'scripts/tenkz_corpus.sh'
              - 'scripts/tenkz_golden.sh'
              - 'scripts/tenkz_kernel_probes.sh'
              - 'scripts/tenkz_string_probes.sh'
              - 'scripts/tenkz_render_corpus.py'
              - 'scripts/test_tenkz_corpus_provenance.py'
              - 'scripts/test_tenkz_corpus_render.py'
              - 'scripts/test_tenkz_dimension_inventory.py'
              - 'scripts/update_tenkz_dimension_inventory.py'
              - 'scripts/test_tenkz_cubic.py'
              # Everything the CTAN archive stages: the material comes from
              # outside `tex/tenkz/` and `docs/tenkz/*.tex`, so the staging
              # check is gated on its sources too.
              - 'scripts/tenkz_ctan.py'
              - 'scripts/test_tenkz_ctan.py'
              - 'docs/tenkz/ctan/**'
              - 'docs/tenkz/CHANGES.md'
              - 'LICENSE'
            shrink:
              - 'blueprint/src/chapter/**'
              - 'tex/tenkz/**'
              - 'tests/tenkz/**'
              - 'docs/tenkz/**'
              - 'scripts/tenkz_language.py'
              - 'scripts/tenkz_lint.py'
              - 'scripts/tenkz_shrink.py'
              - 'scripts/tenkzlib/**'
              - 'scripts/test_tenkz_shrink.py'
            workflow:
              - '.github/workflows/pr-ci.yml'
              - '.github/workflows/tenkz-rmp-book.yml'

  tenkz-shrink:
    name: Check tenkz shrink ratchets
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.shrink == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check language and shrink contracts
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          python3 scripts/tenkz_language.py check
          python3 scripts/test_tenkz_shrink.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin \
              "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            python3 scripts/tenkz_shrink.py gate --base-ref "$BASE_REF"
          else
            python3 scripts/tenkz_shrink.py gate
          fi

  tenkz-corpus:
    name: Check tenkz regression corpus
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.corpus == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Test tenkz provenance invariant
        run: python3 scripts/test_tenkz_corpus_provenance.py

      - name: Test exact RMP dimension inventory
        run: python3 scripts/test_tenkz_dimension_inventory.py

      - name: Test tenkz render baseline replacement
        run: python3 scripts/test_tenkz_corpus_render.py

      # The seeded equation defects: a mismatched group must fail the audit
      # and a clean one must pass, wherever tenkz pictures compile.
      - name: Test tenkz equation group enforcement
        run: |
          python3 scripts/test_tenkz_equation_audit.py
          python3 scripts/test_tenkz_blueprint_sweep.py

      - name: Test tenkz manual extraction and reference coverage
        run: python3 scripts/test_tenkz_manual_doctest.py

      - name: Install TeX dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1

      - name: Compile tenkz manual examples standalone
        run: python3 scripts/tenkz_manual_doctest.py

      # The same check tenkz-release-policy.yml runs, here with an engine
      # present: the archive is unpacked on its own and a picture compiled
      # against it, so a runtime file the upload forgot fails rather than
      # falling back to the repository copy.
      - name: Check the CTAN archive against a clean installation
        run: python3 scripts/tenkz_ctan.py check --require-smoke

      - name: Check tenkz kernel record contracts
        run: scripts/tenkz_kernel_probes.sh

      - name: Compile and audit tenkz corpus
        run: TENKZ_CORPUS_JOBS=4 scripts/tenkz_corpus.sh
      - name: Check golden event baselines
        run: TENKZ_CORPUS_JOBS=4 scripts/tenkz_golden.sh --check
      - name: Check string-engine event and pixel probes
        run: scripts/tenkz_string_probes.sh

  # Compiles, audits, and typesets the 130-target RMP benchmark: tenkz's own
  # reproduction of the diagrams in the tensor-network review paper it is
  # modeled on. This is the book the library was actually built against, and
  # it is where every visual defect in the campaign was found — including one
  # regression that every other job in this file missed (issue #5824).
  # "book" does everything "check" does (each target compiled standalone,
  # its render event log audited) and then typesets the full book, so a break
  # in the book's own preamble or page layout also fails here instead of
  # waiting up to a week for tenkz-rmp-book.yml (issue #5828). The typeset
  # adds under a minute on a ten-core development machine; the 130 target
  # compiles that dominate either command measured six to eight minutes on
  # GitHub's runner. Every target always runs — there is no changed-target
  # subset, because a reachability heuristic that silently missed a target
  # would be worse than a full corpus that costs single-digit minutes. The
  # genuinely slower step, rasterizing every page to an image, runs weekly
  # and on demand instead, in tenkz-rmp-book.yml, because that step is about
  # producing the reviewable book, not about catching a regression quickly.
  tenkz-rmp:
    name: Check tenkz RMP benchmark corpus
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.corpus == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install TeX dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1

      # Each target's XeLaTeX compile has a fixed two-minute ceiling inside
      # the harness. GitHub's hosted runner has four shared cores, and four
      # parallel compiles left no slack: one run timed out a target under
      # ordinary load. Two parallel compiles leave that headroom back.
      # The work tree is kept outside the checkout (the harness puts the
      # whole repository on TEXINPUTS recursively) and preserved past the
      # run, so a failing target's transcript, event log, and render can be
      # uploaded below.
      - name: Compile, audit, and typeset the tenkz RMP benchmark
        env:
          TENKZ_RMP_JOBS: "2"
          TENKZ_RMP_WORK_ROOT: ${{ runner.temp }}/rmp-work
        run: python3 scripts/tenkz_rmp.py book --all

      # On a red run the job log carries only the tail of the failing
      # compile; the offending render and its event log never reach the
      # console at all. Upload the preserved work tree so the failure is
      # diagnosable from the Actions page. Green runs upload nothing, so
      # the common path stores no artifacts.
      - name: Upload failure transcripts, event logs, and renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenkz-rmp-failure
          path: |
            ${{ runner.temp }}/rmp-work/targets/**/*.txt
            ${{ runner.temp }}/rmp-work/targets/**/*.log
            ${{ runner.temp }}/rmp-work/targets/**/*.tnlog
            ${{ runner.temp }}/rmp-work/targets/**/*.pdf
            ${{ runner.temp }}/rmp-work/*.txt
            ${{ runner.temp }}/rmp-work/*.log
            ${{ runner.temp }}/rmp-work/*.pdf
          retention-days: 7
          if-no-files-found: warn

  build:
    needs: changes
    outputs:
      compilation-time-result: ${{ steps.compilation-time.outputs.result }}
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.blueprint == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore Lean build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      - name: Build Lean project and capture timings
        run: |
          set -eo pipefail
          {
            lake build
            lake build lint_style
          } 2>&1 | tee "$RUNNER_TEMP/lake-build.log"

      - name: Check changed Lean compilation times
        id: compilation-time
        if: github.event_name == 'pull_request'
        env:
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          timing_status=0
          archive_build_failed=false
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF_NAME:refs/remotes/origin/$BASE_REF_NAME" \
            || timing_status=$?
          if [ "$timing_status" -eq 0 ]; then
            git -c core.quotePath=false diff \
              --merge-base --name-only --diff-filter=AMR "$BASE_REF" -- '*.lean' \
              > "$RUNNER_TEMP/changed-lean-files.txt" \
              || timing_status=$?
          fi
          if [ "$timing_status" -eq 0 ]; then
            while IFS= read -r path; do
              case "$path" in
                # Keep this aligned with EXCLUDED_TOP_LEVEL_DIRECTORIES in
                # scripts/generate_import_aggregators.py.
                TNLean/Archive/*.lean)
                  module="${path%.lean}"
                  module="${module//\//.}"
                  lake build "$module" 2>&1 \
                    | tee -a "$RUNNER_TEMP/lake-build.log" \
                    || {
                      timing_status=$?
                      archive_build_failed=true
                    }
                  ;;
              esac
              [ "$timing_status" -eq 0 ] || break
            done < "$RUNNER_TEMP/changed-lean-files.txt"
          fi
          if [ "$timing_status" -eq 0 ]; then
            python3 scripts/lake_build_hotspots.py \
              "$RUNNER_TEMP/lake-build.log" \
              --changed-files-from "$RUNNER_TEMP/changed-lean-files.txt" \
              || timing_status=$?
          fi
          case "$timing_status" in
            0) result=success ;;
            50) result=limit ;;
            *) result=error ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$archive_build_failed" = true ]; then
            exit 1
          fi

      - name: Run text-based style linter
        run: lake exe lint_style --github

      # `checkdecls` imports TNLean modules to resolve every tagged declaration,
      # so it must run after the project build rather than in the TeX-only job.
      - name: Generate Blueprint Lean declaration list
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check Blueprint Lean declarations
        timeout-minutes: 10
        run: lake exe checkdecls blueprint/lean_decls

      # A cancelled or failed build can leave partially written `.olean` files.
      # Restore only caches saved after the complete build and style checks pass.
      - name: Save Lean build cache (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

  compile-time:
    name: Check changed Lean compilation times
    needs: [changes, build]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce changed-module timing limit
        env:
          TIMING_RESULT: ${{ needs.build.outputs.compilation-time-result }}
        run: |
          case "$TIMING_RESULT" in
            success) ;;
            limit)
              echo "::error::A changed Lean module reached the 50-second compilation limit"
              exit 1
              ;;
            *)
              echo "::error::The changed-module compilation-time checker failed"
              exit 1
              ;;
          esac

  file-length:
    name: Check Lean module policies
    needs: changes
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.lean == 'true' ||
        needs.changes.outputs.module_policy == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Lean module-policy checkers
        run: PYTHONPATH=scripts python3 scripts/test_lean_file_policies.py -v

      - name: Test Lean compilation-time checker
        run: python3 scripts/test_lake_build_hotspots.py

      - name: Check local cache-seeding shell syntax
        run: |
          bash -n scripts/seed_lake_build.sh
          bash -n scripts/test_seed_lake_build.sh

      # Ordinary Lean modules over 1000 lines fail. The exact root aggregator
      # exemption is accepted only while its uncommented content is import-only.
      - name: Run oversized-file guard
        run: >
          PYTHONPATH=scripts python3 scripts/check_oversized_lean_files.py
          --root .
          --import-only-aggregator TNLean.lean

      - name: Fetch pull-request base for the debt ratchet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Reject new numbered-sequel modules (pull request)
        if: github.event_name == 'pull_request'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref "origin/${{ github.event.pull_request.base.ref }}"

      - name: Reject new numbered-sequel modules (push)
        if: github.event_name == 'push'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref "${{ github.event.before }}"

      - name: Reject new numbered-sequel modules (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: >
          python3 scripts/check_numbered_lean_files.py
          --root .
          --base-ref HEAD^

  blueprint:
    name: Check blueprint compiles without errors
    needs: changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.changes.result == 'success')"
    runs-on: ubuntu-latest
    env:
      # TeX-facing steps run only when blueprint sources changed (always on
      # push/dispatch); the Lean-blueprint sync checks run on Lean-only
      # changes too.
      TEX_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.blueprint == 'true' || needs.changes.outputs.workflow == 'true' }}
      # The paper-gap reference check also runs when only the notes, the
      # Lean sources, the Markdown docs, or the generator changed.
      PAPER_GAPS_CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.paper_gaps == 'true' || needs.changes.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate CPSV16 every-label audit
        run: |
          python3 scripts/test_audit_cpsv16_labels.py
          python3 scripts/audit_cpsv16_labels.py

      - name: Check reader-facing prose patterns
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          python3 scripts/check_reader_facing_prose.py --root . --diff-base "$BASE_REF" --ci

      - name: Detect changed Lean files
        id: changed-lean-files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          changed_lean_paths="$(git diff --merge-base --name-only "$BASE_REF" -- \
            TNLean.lean 'TNLean/**/*.lean' lakefile.* lean-toolchain lake-manifest.json)"
          if [ -n "$changed_lean_paths" ]; then
            has_changed_lean=true
          else
            has_changed_lean=false
            while IFS= read -r tex_file; do
              if [ -f "$tex_file" ] && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' "$tex_file"; then
                has_changed_lean=true
                break
              fi
              base_tex="$(git show "$BASE_REF:$tex_file" 2>/dev/null || true)"
              if [ -n "$base_tex" ] \
                  && grep -Eq '\\lean\{|\\uses\{|\\leanok|\\notready' <<< "$base_tex"; then
                has_changed_lean=true
                break
              fi
            done < <(git diff --merge-base --name-only "$BASE_REF" -- \
              'blueprint/src/**/*.tex' 'blueprint/src/*.tex')
          fi
          echo "has_changed_lean=$has_changed_lean" >> "$GITHUB_OUTPUT"

      - name: Install blueprint system dependencies
        if: env.TEX_CHANGED == 'true'
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1

      # Also installed for paper-gap-only changes: the reference check
      # below runs the texra-blueprint CLI from this step's pip install.
      - name: Install blueprint Python dependencies
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.4'

      - name: Lint tenkz picture sources
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 scripts/tenkz_lint.py \
            'blueprint/src/chapter/*.tex' \
            'docs/tenkz/manual2.tex' \
            'docs/tenkz/chapters2/*.tex' \
            'docs/slides/*.tex' \
            'tex/tenkz/examples/*.tex'

      - name: Test shared tenkz parsers
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 scripts/test_tnlog.py
          python3 scripts/test_texcase.py
          python3 scripts/test_tenkz_kernel_audit.py

      - name: Check paper-gap references resolve
        if: env.TEX_CHANGED == 'true' || env.PAPER_GAPS_CHANGED == 'true'
        run: texra-blueprint paper-gaps check

      # Build the root manual as well as its input chapters.  This is the
      # syntax gate for manual2.tex, tenkzmanual2.sty, and the expl3 package
      # sources; generic chktex is unsuitable for their deliberate notation.
      - name: Compile tenkz manual
        if: env.TEX_CHANGED == 'true'
        run: |
          cd docs/tenkz
          timeout 150 env TEXINPUTS="../../tex/tenkz//:" \
            xelatex -interaction=nonstopmode -halt-on-error manual2.tex
          timeout 150 env TEXINPUTS="../../tex/tenkz//:" \
            xelatex -interaction=nonstopmode -halt-on-error manual2.tex
          python3 ../../scripts/tenkz_audit.py manual2.tnlog

      - name: Compile tenkz acceptance examples
        if: env.TEX_CHANGED == 'true'
        run: |
          for source in "$GITHUB_WORKSPACE"/tex/tenkz/examples/*.tex; do
            source_dir="$(dirname "$source")"
            source_file="$(basename "$source")"
            (
              cd "$source_dir"
              timeout 120 env TEXINPUTS="$GITHUB_WORKSPACE/tex/tenkz//:" \
                xelatex -interaction=nonstopmode -halt-on-error "$source_file"
            )
            python3 scripts/tenkz_audit.py "${source%.tex}.tnlog"
          done

      # Compile-and-cache smoke test of the tenkz picture pipeline
      # (blueprint/src/Packages/tenkz_pic.py): renders the spec benchmark
      # units standalone and checks ink, caching, and per-figure
      # invalidation.
      - name: Smoke-test tenkz picture pipeline
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_pic.py

      - name: Test tenkz equation audit
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_equation_audit.py

      - name: Test measured tenkz label overlaps
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_label_overlap.py

      - name: Test source-linked PEPS torus geometry
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_peps_torus.py

      - name: Test tenkz coefficient-index routing
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_index_routing.py

      - name: Test tenkz fusion-tree topology
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_tenkz_tree.py

      - name: Lint LaTeX (chktex)
        if: env.TEX_CHANGED == 'true'
        run: |
          find blueprint/src tex/tenkz/examples -name '*.tex' -not -path '*/Packages/*' -print0 \
            | xargs -0 -r chktex -q -l blueprint/.chktexrc

      # continue-on-error: the runner's latexindent 3.23.6 (TeX Live 2023,
      # texlive-extra-utils on ubuntu-latest) is intermittently
      # nondeterministic in `-k` check mode on
      # blueprint/src/chapter/ch21_mpdo_rfp_simple_definition.tex (a ragged
      # 4-column \begin{align} block at lines 482-484): the file is
      # correctly formatted -- 32/32 isolated and full-tree stress-mode
      # invocations pass, and -w -s is a no-op on it -- yet the real
      # pull_request-triggered check step has failed on it 3/3 times
      # (LionSR/TNLean#6874, then twice more on main after the merge).
      # Re-enforce once the flake is root-caused (candidates: pin an exact
      # latexindent release rather than tracking apt's texlive-extra-utils,
      # or restructure the align block to a uniform column count).
      - name: Check LaTeX formatting (latexindent)
        if: env.TEX_CHANGED == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -e
          status=0
          while IFS= read -r f; do
            if ! latexindent -k -s -l blueprint/latexindent.yaml "$f" > /dev/null; then
              echo "::warning file=$f::not formatted to blueprint/latexindent.yaml; run 'latexindent -l blueprint/latexindent.yaml -w -s \"$f\"' locally to fix"
              status=1
            fi
          done < <(find blueprint/src tex/tenkz/examples -name '*.tex' -not -path '*/Packages/*')
          exit $status

      - name: Build blueprint bibliography
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/blueprint_bibtex.py

      - name: Run leanblueprint web and check for errors
        if: env.TEX_CHANGED == 'true'
        working-directory: blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          # Run leanblueprint, streaming output to the log and capturing it to a file
          set +o pipefail
          leanblueprint web 2>&1 | tee "$tmp_output_file"
          cmd_status=${PIPESTATUS[0]}
          set -o pipefail

          # Check for blueprint ERROR lines in the captured output
          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::warning::Blueprint has missing file references (see WARNING lines above)"
          fi

          # A command plasTeX does not know reaches the page through whichever
          # template happens to share its name, and a node with no template at
          # all reaches it through the fallback. Both produced reader-visible
          # corruption from a build that reported success, so both fail here.
          if grep -qE "WARNING: (unrecognized command/environment|Using default renderer)" \
               "$tmp_output_file"; then
            echo "::error::Blueprint uses a command the web renderer does not know; declare it in blueprint/src/Packages/tnlean_patches.py or the texra-blueprint plugin"
            exit 1
          fi

          # If leanblueprint itself failed, propagate its exit status
          if [ "$cmd_status" -ne 0 ]; then
            exit "$cmd_status"
          fi

      # Every blueprint picture compiled standalone during the web build and
      # left its event stream in the render cache; the sweep audits all of
      # them, so the boundary-signature rules reach the volume's figures and
      # not only the regression corpus.
      - name: Sweep tenkz blueprint event streams
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/tenkz_blueprint_sweep.py

      - name: Test tenkz equation web layout
        if: env.TEX_CHANGED == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_tenkz_equation_web.py --web-root blueprint/web

      # A zero exit status says the build ran, not that the pages read. This
      # opens every generated page and measures what a reader would meet.
      - name: Test generated blueprint pages
        if: env.TEX_CHANGED == 'true'
        run: python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Generate lean_decls from blueprint .tex files
        id: lean-decls
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check blueprint and Lean source stay in sync
        if: steps.lean-decls.outcome == 'success'
        run: python3 scripts/blueprint_lean_sync.py --root . --ci

      - name: Fetch PR base ref for diff
        id: fetch-base-ref
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Error on changed Lean declarations missing blueprint entries
        if: github.event_name == 'pull_request' && steps.changed-lean-files.outputs.has_changed_lean == 'true'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base_ref = os.environ["BASE_REF"]

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--merge-base",
                  "--name-only",
                  "--diff-filter=AMR",
                  base_ref,
                  "--",
                  "TNLean.lean",
                  "TNLean/**/*.lean",
              ],
              text=True,
          )
          changed_lean_files = [line for line in changed.splitlines() if line.endswith(".lean")]

          if not changed_lean_files:
              print("No changed TNLean/*.lean files in this pull request.")
              raise SystemExit(0)

          subprocess.run(
              [
                  "python3",
                  "scripts/blueprint_lean_sync.py",
                  "--root",
                  ".",
                  "--warn-missing-blueprint",
                  "--diff-base",
                  base_ref,
                  "--changed-files",
                  *changed_lean_files,
              ],
              check=True,
          )
          PY
