name: Badges

on:
  schedule:
    # Refresh informational badges weekly on Sunday at 05:30 UTC.
    - cron: '30 5 * * 0'
  workflow_dispatch:

concurrency:
  group: badges-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  badges:
    runs-on: ubuntu-latest
    name: Generate Lean badges
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate badge JSON
        run: |
          python3 scripts/generate_badges.py --output-dir badge-output
          json_count=$(find badge-output -maxdepth 1 -name '*.json' | wc -l)
          if [ "$json_count" -eq 0 ]; then
            echo "::error::No badge JSON generated — refusing to publish empty badges"
            exit 1
          fi

      - name: Upload badges component
        uses: actions/upload-artifact@v4
        with:
          name: site-badges
          path: badge-output
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: badges
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
