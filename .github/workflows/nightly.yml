name: Nightly CI

# The integration pipeline. Pull requests run only the light checks of
# pr-ci.yml (changed modules, lint, source-level policies), so the whole
# library is built and the blueprint is rendered and tested here, once a
# night on main: the root `lake build`, the compiled declaration checks, the
# diagram and browser tests, the print volumes, and the publication of the
# site. A failed run on main starts nightly-fix.yml, whose agent opens a
# repair pull request and dispatches this workflow on its branch to verify
# it. See docs/ci-automation.md.

on:
  schedule:
    # 19:23 UTC, off the hour to avoid the scheduler's busiest minutes.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even when this commit already passed a nightly run
        type: boolean
        default: false

# A running main build is never cancelled, so it finishes and saves its build
# cache; a newer verification run of a repair branch replaces an older one.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Build-cache policy: this workflow's build of main is the only writer of the
# Lean build cache; pull requests restore it read-only (pr-ci.yml).
# lean-action's built-in GitHub cache is disabled because it saved a ~2.4 GB
# entry per run, which cycled main's entry out of the 10 GB repository cache
# budget. Mathlib and its dependencies are intentionally excluded:
# `lake exe cache get` (run inside lean-action) restores them faster than a
# GitHub cache of that size could.
env:
  BUILD_CACHE_PATHS: |
    .lake/build
    .lake/packages/Gametheory/.lake/build
    .lake/packages/checkdecls/.lake/build
    .lake/packages/qiclean/.lake/build
    .lake/packages/cslib/.lake/build

jobs:
  # Find the last commit of main that passed this workflow. A scheduled run
  # on that same commit has nothing new to check and is skipped; otherwise
  # the commit is the base for the changed-file checks and the ratchets.
  plan:
    name: Plan the nightly run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Find the last passing nightly commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          base="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || base=""
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$FORCE" != true ] && [ "$base" = "$GITHUB_SHA" ]; then
            run=false
            echo "::notice::$GITHUB_SHA already passed a nightly run; nothing to do."
          fi
          {
            echo "run=$run"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Lean build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      - name: Build Lean project and capture timings
        id: lean-build
        run: |
          set -eo pipefail
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          {
            lake build
            lake build lint_style
          } 2>&1 | tee -a "$RUNNER_TEMP/lake-build.log"

      # Saved as soon as the library is built, so a failure of a later check
      # does not cost the next pull requests their cache. A cancelled or
      # failed build can leave partially written `.olean` files and saves
      # nothing. scripts/ci_compatible_cache.py reads this step by name.
      - name: Save Lean build cache (main only)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: tnlean-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

      # Elaborate, with warnings as errors, every production file changed
      # since the last passing nightly commit. Pull requests check their own
      # edits the same way; this catches what a budget cut short there.
      # Selection: scripts/ci_lean_checks.py.
      - name: Check changed Lean files strictly
        timeout-minutes: 120
        run: |
          set -eo pipefail
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || BASE_SHA=""
          fi
          python3 scripts/ci_lean_checks.py strict --jobs 3

      - name: Run text-based style linter
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: lake exe lint_style --github

      # `checkdecls` imports TNLean modules to resolve every tagged declaration,
      # so it runs after the project build.
      - name: Generate Blueprint Lean declaration list
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check Blueprint Lean declarations
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        timeout-minutes: 10
        run: lake exe checkdecls blueprint/lean_decls

      - name: Generate paper-gap Lean declaration list
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: python3 scripts/paper_gap_leanid_sync.py --root . --output "$RUNNER_TEMP/paper_gap_leanid_decls"

      - name: Check paper-gap Lean declarations
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        timeout-minutes: 10
        run: lake exe checkdecls "$RUNNER_TEMP/paper_gap_leanid_decls"

      # The slowest modules of the whole library, for the job summary.
      - name: Report compilation-time hotspots
        if: ${{ !cancelled() && steps.lean-build.outcome == 'success' }}
        run: |
          {
            echo '### Slowest modules'
            echo '```'
            python3 scripts/lake_build_hotspots.py report "$RUNNER_TEMP/lake-build.log" --limit 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The whole-repository policies. Each pull request passes them against its
  # own base; two pull requests merged side by side can still break one
  # together, so the merged tree is checked again.
  policies:
    name: Check Lean module policies
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check generated import aggregators
        run: PYTHONPATH=scripts python3 scripts/generate_import_aggregators.py --check

      - name: Check docbuild manifest against the root manifest
        if: ${{ !cancelled() }}
        run: python3 scripts/check_docbuild_manifest.py --root .

      - name: Run oversized-file guard
        if: ${{ !cancelled() }}
        run: >
          PYTHONPATH=scripts python3 scripts/check_oversized_lean_files.py
          --root .
          --import-only-aggregator TNLean.lean

      # The recorded violations and ceilings may only shrink against the last
      # passing nightly commit; without one the previous commit is the base.
      - name: Check import layers, pass-throughs and small modules
        if: ${{ !cancelled() }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          python3 scripts/check_import_layers.py --root . --base-ref "$base"
          python3 scripts/check_pass_through_declarations.py --root . --base-ref "$base"
          python3 scripts/check_small_lean_modules.py --root . --base-ref "$base"

  inline-layout:
    name: Check inline diagram semantics
    needs: plan
    if: needs.plan.outputs.run == 'true'
    # Pinned: on ubuntu-26.04 Playwright has no chromium and the TeX diagram tools are missing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser and browser
        run: |
          python3 -m pip install plasTeX==3.1 playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test inline picture semantics
        run: python3 scripts/test_tenkz_inline_web.py


  # The blueprint as a reader meets it: every diagram test, the web build,
  # and the browser tests of the generated pages. The print volumes are built
  # by the publication job below.
  blueprint:
    name: Test blueprint diagrams and web pages
    needs: plan
    if: needs.plan.outputs.run == 'true'
    # Pinned: on ubuntu-26.04 Playwright has no chromium and the TeX diagram tools are missing.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test blueprint search preparation
        run: python3 scripts/test_add_blueprint_search.py

      - name: Fetch pinned tenkz package
        run: python3 scripts/fetch_tenkz.py

      - name: Configure apt retries
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "60";' \
            'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

      - name: Install blueprint system dependencies
        id: blueprint-system-deps-1
        timeout-minutes: 10
        continue-on-error: true
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      - name: Recover an interrupted package install
        if: steps.blueprint-system-deps-1.outcome == 'failure'
        timeout-minutes: 5
        # The timed-out install can leave its apt-get running and holding the
        # package locks, so stop the lock holders before repairing the database.
        run: |
          locks=(/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock
            /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            "$RUNNER_TEMP"/blueprint-apt-archives/*/lock)
          for signal in TERM KILL; do
            sudo fuser -k -"$signal" "${locks[@]}" 2>/dev/null || true
            sleep 5
          done
          sudo dpkg --configure -a || true
          # A crawling Azure mirror is the usual cause; fetch the retry from the
          # main archive instead.
          # Ubuntu runners list the mirror in apt-mirrors.txt and point the
          # sources at it with mirror+file:, so rewrite both.
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
              /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i \
                's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            fi
          done

      - name: Install blueprint system dependencies (retry)
        if: steps.blueprint-system-deps-1.outcome == 'failure'
        # A slow mirror can need more than one attempt; the packages fetched by the
        # first attempt stay in the archive directory, so the retry resumes.
        timeout-minutes: 45
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      # Also installed for paper-gap-only changes: the reference check
      # below runs the texra-blueprint CLI from this step's pip install.
      - name: Install blueprint Python dependencies
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Check paper source label generator syntax
        run: bash -n scripts/generate_paper_aux.sh

      - name: Generate paper source labels
        run: |
          ./scripts/generate_paper_aux.sh 1606.00608
          ./scripts/generate_paper_aux.sh 2502.20257

      - name: Check paper-gap references resolve
        run: texra-blueprint paper-gaps check

      # Every scripts/test_tenkz_*.py and scripts/test_*_diagram.py test.
      # New diagram tests need no workflow edit. Runner: scripts/run_diagram_tests.py.
      - name: Test diagram test runner
        run: python3 scripts/test_run_diagram_tests.py

      - name: Test blueprint diagrams
        id: diagram-tests
        run: python3 scripts/run_diagram_tests.py --output-dir "$RUNNER_TEMP/diagram-tests"

      - name: Preserve rendered diagrams and diagnostics for review
        if: >-
          !cancelled() &&
          (steps.diagram-tests.outcome == 'success' || steps.diagram-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: diagram-tests-${{ github.sha }}
          path: ${{ runner.temp }}/diagram-tests
          if-no-files-found: error
          retention-days: 3

      - name: Build blueprint bibliography
        run: texra-blueprint bbl

      # Reuse the pictures the last publication build compiled (blueprint.yml
      # saves them); a picture is named by the hash of its source, so only
      # figures edited since are compiled again. Read only.
      - name: Restore tenkz picture cache
        uses: actions/cache/restore@v6
        with:
          path: |
            blueprint/web/tenkz_svg
            blueprint/src/.tenkz_svg_cache
          key: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-${{ github.run_id }}
          restore-keys: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-

      - name: Run texra-blueprint web and check for errors
        working-directory: blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          # texra-blueprint web wraps leanblueprint web and fails when the
          # renderer meets a command it does not know (unrecognized
          # command/environment, default-renderer fallback); the log is kept
          # for the label checks below.
          texra-blueprint web 2>&1 | tee "$tmp_output_file"

          # Check for blueprint ERROR lines in the captured output
          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::warning::Blueprint has missing file references (see WARNING lines above)"
          fi

      - name: Prune unused tenkz pictures
        run: python3 scripts/prune_tenkz_render_cache.py

      # Every blueprint picture compiled standalone during the web build and
      # left its event stream in the render cache; the sweep audits all of
      # them, so the boundary-signature rules reach the volume's figures and
      # not only the regression corpus.
      - name: Sweep tenkz blueprint event streams
        run: python3 scripts/tenkz_blueprint_sweep.py

      - name: Test tenkz equation web layout
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_tenkz_equation_web.py --web-root blueprint/web

      - name: Add and test blueprint search
        run: |
          python3 -m pip install --disable-pip-version-check 'pagefind[extended]==1.5.2'
          python3 scripts/add_blueprint_search.py --web-root blueprint/web
          python3 scripts/test_blueprint_search_web.py --web-root blueprint/web

      - name: Test dependency graph rendering and terminal errors
        timeout-minutes: 2
        run: python3 scripts/test_blueprint_graph_worker.py --browser-smoke

      - name: Test precomputed dependency graph interactions
        timeout-minutes: 2
        run: python3 scripts/test_blueprint_graph_precompute.py --browser-smoke

      # A zero exit status says the build ran, not that the pages read. This
      # opens every generated page and measures what a reader would meet.
      - name: Test generated blueprint pages
        run: |
          python3 scripts/test_blueprint_graph_worker.py
          python3 scripts/test_blueprint_graph_precompute.py
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Preserve failed blueprint render
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-render-failure
          path: blueprint/web
          retention-days: 3

      - name: Test Blueprint declaration scanner
        run: python3 scripts/test_blueprint_lean_sync.py

      - name: Test paper-gap Lean declaration scanner
        run: PYTHONPATH=scripts python3 scripts/test_paper_gap_leanid_sync.py

      - name: Generate lean_decls from blueprint .tex files
        id: lean-decls
        env:
          BLUEPRINT_SYNC_FETCH_DEPS: '1'
        run: python3 scripts/blueprint_lean_sync.py --root . --update-lean-decls

      - name: Check blueprint and Lean source stay in sync
        if: steps.lean-decls.outcome == 'success'
        env:
          BLUEPRINT_SYNC_FETCH_DEPS: '1'
        run: python3 scripts/blueprint_lean_sync.py --root . --ci --report-duplicate-tags

  # Build the print volumes and the web pages and, on main, publish the site.
  # A broken print volume fails here, which is the nightly check that the
  # blueprint PDF compiles.
  site:
    name: Publish blueprint
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/blueprint.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
