name: Blueprint

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'blueprint/src/**'
      - 'docs/paper-gaps/**'
      - 'texra-blueprint.toml'
      # Trees the paper-gap reference check scans (texra-blueprint
      # paper-gaps check); without these the check never runs
      # on merge pushes that only touch a scanned file.
      - 'blueprint/comments/**'
      - 'docs/**/*.md'
      - 'tenkz.toml'
      - 'scripts/fetch_tenkz.py'
      - 'scripts/tenkz_paths.py'
      - 'docs/slides/**'
      - '.github/workflows/blueprint.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'home_page/**'
      - 'scripts/build_blueprint_ch01_12.sh'
      - 'scripts/assemble-pages-site.sh'
      - 'scripts/fetch-latest-artifact.sh'
      - 'scripts/write_badges.py'
      - 'scripts/tenkz_blueprint_sweep.py'
      - 'scripts/test_tenkz_pic.py'
  workflow_dispatch:

# Rapid pushes to main only need the newest build; actual Pages deployments
# are serialized by the deploy job in deploy-pages.yml.
concurrency:
  group: blueprint-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    name: Build blueprint site components
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install system dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          # texlive-fonts-extra supplies dsfont, which paper-gap notes load;
          # keep this cache separate from the extra-package-free web cache.
          cache-suffix: web-v2
          extra-packages: texlive-fonts-extra

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Fetch pinned tenkz package
        run: python3 scripts/fetch_tenkz.py

      - name: Check native tenkz sources and picture pipeline
        run: |
          python3 .deps/tenkz/scripts/tenkz_lint.py \
            'blueprint/src/chapter/*.tex' \
            'docs/slides/*.tex'
          python3 scripts/test_tenkz_pic.py

      - name: Check paper-gap references resolve
        run: texra-blueprint paper-gaps check

      - name: Build blueprint bibliography
        run: texra-blueprint bbl

      # The bibliography links every paper-gap note to its published PDF. Build
      # those PDFs in the same merge-triggered workflow that publishes the links
      # instead of reusing the last Full documentation artifact.
      - name: Build paper-gap PDFs
        run: texra-blueprint --root . paper-gaps build

      - name: Build blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          leanblueprint pdf

          # texra-blueprint web wraps leanblueprint web and fails when the
          # renderer meets a command it does not know (unrecognized
          # command/environment, default-renderer fallback) — the gate that
          # pr-ci.yml applies to a branch. The log is kept for the label
          # checks below.
          texra-blueprint web 2>&1 | tee "$tmp_output_file"

          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::warning::Blueprint has unresolved labels (see ERROR lines above)"
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::error::Blueprint has missing files (see WARNING lines above)"
            exit 1
          fi
          if grep -R "tenkz SVG unavailable" blueprint/web --include='*.html'; then
            echo "::error::Blueprint contains unrendered tenkz SVG placeholders"
            exit 1
          fi

      # A zero exit status says the build ran, not that the pages read. The
      # site is published from here, so the reader-facing check runs here too
      # and not only where a pull request is reviewed.
      - name: Test generated blueprint pages
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Build FT-MPS blueprint volume
        run: ./scripts/build_blueprint_ch01_12.sh

      - name: Package site components
        run: |
          mkdir -p site-blueprint site-badges
          cp -r blueprint/web site-blueprint/blueprint
          cp blueprint/print/print.pdf site-blueprint/blueprint.pdf
          cp blueprint/print/print12.pdf site-blueprint/blueprint-ch01-12.pdf
          texra-blueprint --root . paper-gaps site site-blueprint/paper-gaps
          python3 scripts/write_badges.py site-badges

      # Runs in Docker and produces root-owned output; keep it after the
      # packaging step so it only writes into the pre-created directory.
      - name: Build homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: site-blueprint/homepage

      - name: Upload blueprint component
        uses: actions/upload-artifact@v7
        with:
          name: site-blueprint
          path: site-blueprint
          retention-days: 30

      - name: Upload badges component
        uses: actions/upload-artifact@v7
        with:
          name: site-badges
          path: site-badges
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: blueprint
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
