name: Blueprint

# Builds the print volumes and the web pages and publishes the site from main.
# It no longer runs on every push to main: nightly.yml calls it once a night,
# and it can be dispatched by hand for an immediate publication.

on:
  workflow_call:
  workflow_dispatch:

# Actual Pages deployments are serialized by the deploy job in
# deploy-pages.yml. A run on another branch (a manual dispatch, or the
# nightly verification of a repair branch) builds in its own group and never
# deploys. A running build is left to finish and reach the deploy job.
concurrency:
  group: blueprint-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The print volumes and the web pages share no build output, so they are
  # built on separate runners at once; the site job below joins them.
  pdf:
    # Pinned: on ubuntu-26.04 Playwright has no chromium and the TeX diagram tools are missing.
    runs-on: ubuntu-24.04
    name: Build blueprint PDFs
    env:
      PRINT_AUX_FILES: |
        blueprint/print/*.aux
        blueprint/print/*.bbl
        blueprint/print/*.blg
        blueprint/print/*.fdb_latexmk
        blueprint/print/*.out
        blueprint/print/*.toc
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Configure apt retries
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "60";' \
            'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

      - name: Install system dependencies
        id: blueprint-system-deps-1
        timeout-minutes: 10
        continue-on-error: true
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          # texlive-fonts-extra supplies dsfont, which paper-gap notes load;
          # keep this cache separate from the extra-package-free web cache.
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      - name: Recover an interrupted package install
        if: steps.blueprint-system-deps-1.outcome == 'failure'
        timeout-minutes: 5
        # The timed-out install can leave its apt-get running and holding the
        # package locks, so stop the lock holders before repairing the database.
        run: |
          locks=(/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock
            /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            "$RUNNER_TEMP"/blueprint-apt-archives/*/lock)
          for signal in TERM KILL; do
            sudo fuser -k -"$signal" "${locks[@]}" 2>/dev/null || true
            sleep 5
          done
          sudo dpkg --configure -a || true
          # A crawling Azure mirror is the usual cause; fetch the retry from the
          # main archive instead.
          # Ubuntu runners list the mirror in apt-mirrors.txt and point the
          # sources at it with mirror+file:, so rewrite both.
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
              /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i \
                's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            fi
          done

      - name: Install system dependencies (retry)
        if: steps.blueprint-system-deps-1.outcome == 'failure'
        # A slow mirror can need more than one attempt; the packages fetched by the
        # first attempt stay in the archive directory, so the retry resumes.
        timeout-minutes: 45
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          # texlive-fonts-extra supplies dsfont, which paper-gap notes load;
          # keep this cache separate from the extra-package-free web cache.
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Fetch pinned tenkz package
        run: python3 scripts/tenkz/fetch_tenkz.py

      - name: Lint tenkz picture sources
        run: |
          python3 .deps/tenkz/scripts/tenkz_lint.py \
            'blueprint/src/chapter/*.tex' \
            'blueprint/src/figures/*.tex' \
            'docs/slides/*.tex'

      - name: Check paper-gap references resolve
        run: texra-blueprint paper-gaps check

      - name: Build blueprint bibliography
        run: texra-blueprint bbl

      # The bibliography links every paper-gap note to its published PDF. Build
      # those PDFs in the same merge-triggered workflow that publishes the links
      # instead of reusing the last Full documentation artifact.
      - name: Generate paper source aux for paper-gap references
        run: |
          ./scripts/blueprint/generate_paper_aux.sh 1606.00608
          ./scripts/blueprint/generate_paper_aux.sh 2502.20257

      - name: Build paper-gap PDFs
        run: texra-blueprint --root . paper-gaps build

      # Seed latexmk with the previous build's auxiliary files. From a cold
      # start the print volume needs four full XeLaTeX passes (about six
      # minutes each) before labels, citations and page numbers settle; from
      # the last build's auxiliary files a typical merge needs one or two.
      - name: Restore PDF auxiliary files
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PRINT_AUX_FILES }}
          key: blueprint-print-aux-${{ github.run_id }}
          restore-keys: blueprint-print-aux-

      # A stale auxiliary file can name a macro that a changed preamble no
      # longer defines; a failed seeded build is retried from a clean slate,
      # so only a genuinely broken source fails the step.
      - name: Build blueprint PDF
        run: |
          if ! leanblueprint pdf; then
            echo "::warning::Seeded PDF build failed; rebuilding from a clean print directory"
            rm -rf blueprint/print
            leanblueprint pdf
          fi

      - name: Save PDF auxiliary files
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PRINT_AUX_FILES }}
          key: blueprint-print-aux-${{ github.run_id }}

      - name: Build FT-MPS blueprint volume
        run: ./scripts/blueprint/build_blueprint_ch01_12.sh

      - name: Package PDFs
        run: |
          mkdir -p site-pdf
          cp blueprint/print/print.pdf site-pdf/blueprint.pdf
          cp blueprint/print/print12.pdf site-pdf/blueprint-ch01-12.pdf
          texra-blueprint --root . paper-gaps site site-pdf/paper-gaps

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-pdf-part
          path: site-pdf
          retention-days: 1

  web:
    # Pinned: on ubuntu-26.04 Playwright has no chromium and the TeX diagram tools are missing.
    runs-on: ubuntu-24.04
    name: Build blueprint web pages
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Configure apt retries
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "60";' \
            'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

      - name: Install system dependencies
        id: blueprint-system-deps-2
        timeout-minutes: 10
        continue-on-error: true
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      - name: Recover an interrupted package install
        if: steps.blueprint-system-deps-2.outcome == 'failure'
        timeout-minutes: 5
        # The timed-out install can leave its apt-get running and holding the
        # package locks, so stop the lock holders before repairing the database.
        run: |
          locks=(/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock
            /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            "$RUNNER_TEMP"/blueprint-apt-archives/*/lock)
          for signal in TERM KILL; do
            sudo fuser -k -"$signal" "${locks[@]}" 2>/dev/null || true
            sleep 5
          done
          sudo dpkg --configure -a || true
          # A crawling Azure mirror is the usual cause; fetch the retry from the
          # main archive instead.
          # Ubuntu runners list the mirror in apt-mirrors.txt and point the
          # sources at it with mirror+file:, so rewrite both.
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
              /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i \
                's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            fi
          done

      - name: Install system dependencies (retry)
        if: steps.blueprint-system-deps-2.outcome == 'failure'
        # A slow mirror can need more than one attempt; the packages fetched by the
        # first attempt stay in the archive directory, so the retry resumes.
        timeout-minutes: 45
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1
        with:
          cache-suffix: web-v3
          extra-packages: texlive-fonts-extra texlive-publishers

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@v1
        with:
          extra-pip-packages: 'git+https://github.com/LionSR/texra-blueprint@v0.3.8'

      - name: Fetch pinned tenkz package
        run: python3 scripts/tenkz/fetch_tenkz.py

      - name: Build blueprint bibliography
        run: texra-blueprint bbl

      - name: Generate paper source aux for paper-gap references
        run: |
          ./scripts/blueprint/generate_paper_aux.sh 1606.00608
          ./scripts/blueprint/generate_paper_aux.sh 2502.20257

      # Every picture is compiled standalone and stored under its content
      # hash (blueprint/src/Packages/tenkz_pic.py), so an SVG from an earlier
      # build is reused exactly when its source, the macros and the pinned
      # tenkz package are unchanged. The key names the renderer, whose engine
      # route the hash does not cover, so a renderer change starts afresh.
      - name: Restore tenkz picture cache
        uses: actions/cache/restore@v6
        with:
          path: |
            blueprint/web/tenkz_svg
            blueprint/src/.tenkz_svg_cache
          key: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-${{ github.run_id }}
          restore-keys: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-

      - name: Build blueprint web pages
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          # texra-blueprint web wraps leanblueprint web and fails when the
          # renderer meets a command it does not know (unrecognized
          # command/environment, default-renderer fallback). The log is kept
          # for the label checks below.
          texra-blueprint web 2>&1 | tee "$tmp_output_file"

          # Pull requests do not build the web pages, so this is where an
          # unresolved label fails.
          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::error::Blueprint has missing files (see WARNING lines above)"
            exit 1
          fi
          if grep -R "tenkz SVG unavailable" blueprint/web --include='*.html'; then
            echo "::error::Blueprint contains unrendered tenkz SVG placeholders"
            exit 1
          fi

      - name: Add client-side search to blueprint web pages
        run: |
          python3 -m pip install --disable-pip-version-check 'pagefind[extended]==1.5.2'
          python3 scripts/test_add_blueprint_search.py
          python3 scripts/add_blueprint_search.py --web-root blueprint/web

      # Check the final pages after search has changed their header and layout.
      - name: Test generated blueprint pages and search
        run: |
          # Chromium 140 loses text layout boxes with the TeX font packages
          # installed; Chromium 141 fixes that renderer bug.
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_blueprint_search_web.py --web-root blueprint/web
          python3 scripts/test_blueprint_graph_worker.py
          python3 scripts/test_blueprint_graph_precompute.py
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web
          python3 scripts/test_blueprint_graph_worker.py --browser-smoke
          python3 scripts/test_blueprint_graph_precompute.py --browser-smoke
          python3 scripts/test_tenkz_equation_web.py --web-root blueprint/web
          python3 scripts/test_tenkz_inline_web.py

      # Every scripts/test_tenkz_*.py and scripts/test_*_diagram.py test.
      # New diagram tests need no workflow edit. Runner: scripts/run_diagram_tests.py.
      - name: Test blueprint diagrams
        id: diagram-tests
        run: |
          python3 scripts/test_run_diagram_tests.py
          python3 scripts/run_diagram_tests.py --output-dir "$RUNNER_TEMP/diagram-tests"

      - name: Preserve rendered diagrams and diagnostics of a failed run
        if: failure() && steps.diagram-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: diagram-tests-${{ github.sha }}
          path: ${{ runner.temp }}/diagram-tests
          retention-days: 3

      # Drop pictures no page references any more, so neither the published
      # site nor the saved cache carries figures that were edited away.
      - name: Prune unused tenkz pictures
        run: python3 scripts/tenkz/prune_tenkz_render_cache.py

      # Every blueprint picture compiled standalone during the web build and
      # left its event stream in the render cache; the sweep audits all of them.
      - name: Sweep tenkz blueprint event streams
        run: python3 scripts/tenkz_blueprint_sweep.py

      - name: Save tenkz picture cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            blueprint/web/tenkz_svg
            blueprint/src/.tenkz_svg_cache
          key: tenkz-render-${{ hashFiles('blueprint/src/Packages/tenkz_pic.py') }}-${{ github.run_id }}

      - name: Upload web pages
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-web-part
          path: blueprint/web
          retention-days: 1

  site:
    needs: [pdf, web]
    # Pinned: on ubuntu-26.04 Playwright has no chromium and the TeX diagram tools are missing.
    runs-on: ubuntu-24.04
    name: Build blueprint site components
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Download web pages
        uses: actions/download-artifact@v8
        with:
          name: blueprint-web-part
          path: site-blueprint/blueprint

      - name: Download PDFs
        uses: actions/download-artifact@v8
        with:
          name: blueprint-pdf-part
          path: site-blueprint

      - name: Write badges
        run: |
          mkdir -p site-badges
          python3 scripts/reports/write_badges.py site-badges

      # Runs in Docker and produces root-owned output; keep it after the
      # other steps so it only writes into the pre-created directory.
      - name: Build homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: site-blueprint/homepage

      # deploy-pages.yml fetches the newest artifact of each name, so only
      # main may publish site components; a manual run elsewhere builds them
      # but keeps them out of the next production deploy.
      - name: Upload blueprint component
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-blueprint
          path: site-blueprint
          retention-days: 30

      - name: Upload badges component
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-badges
          path: site-badges
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: site
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
