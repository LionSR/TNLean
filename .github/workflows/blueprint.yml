name: Blueprint

on:
  push:
    branches:
      - main
    paths:
      - '**.lean'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'blueprint/src/**'
      - 'tex/tenkz/**'
      - 'tests/tenkz/**'
      - 'docs/tenkz/**'
      - 'docs/slides/**'
      - '.github/workflows/blueprint.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'home_page/**'
      - 'scripts/blueprint_bibtex.py'
      - 'scripts/build_blueprint_ch01_12.sh'
      - 'scripts/assemble-pages-site.sh'
      - 'scripts/fetch-latest-artifact.sh'
      - 'scripts/write_badges.py'
      - 'scripts/tenkz_audit.py'
      - 'scripts/tenkz_lint.py'
      - 'scripts/tenkz_rmp.py'
      - 'scripts/tenkzlib/**'
      - 'scripts/test_tnlog.py'
      - 'scripts/test_texcase.py'
      - 'scripts/test_tenkz_kernel_audit.py'
      - 'scripts/test_tenkz_pic.py'
      - 'scripts/test_tenkz_equation_audit.py'
  workflow_dispatch:

# Rapid pushes to main only need the newest build; actual Pages deployments
# are serialized by the deploy job in deploy-pages.yml.
concurrency:
  group: blueprint-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    name: Build blueprint site components
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install system dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@v1

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@v1

      - name: Check native tenkz sources and picture pipeline
        run: |
          python3 scripts/tenkz_lint.py \
            'blueprint/src/chapter/*.tex' \
            'docs/tenkz/manual2.tex' \
            'docs/tenkz/chapters2/*.tex' \
            'docs/slides/*.tex' \
            'tex/tenkz/examples/*.tex'
          python3 scripts/test_tenkz_pic.py
          python3 scripts/test_tenkz_equation_audit.py
          python3 scripts/test_tnlog.py
          python3 scripts/test_texcase.py
          python3 scripts/test_tenkz_kernel_audit.py

      - name: Build blueprint bibliography
        run: python3 scripts/blueprint_bibtex.py

      - name: Build blueprint
        run: |
          set -o pipefail
          tmp_output_file="$(mktemp)"

          leanblueprint pdf

          set +o pipefail
          leanblueprint web 2>&1 | tee "$tmp_output_file"
          cmd_status=${PIPESTATUS[0]}
          set -o pipefail

          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::warning::Blueprint has unresolved labels (see ERROR lines above)"
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::error::Blueprint has missing files (see WARNING lines above)"
            exit 1
          fi
          # A command plasTeX does not know reaches the page through whichever
          # template happens to share its name, and a node with no template at
          # all reaches it through the fallback. Both produced reader-visible
          # corruption from a build that reported success, so neither may be
          # published. This is the gate that pr-ci.yml applies to a branch.
          if grep -qE "WARNING: (unrecognized command/environment|Using default renderer)" \
               "$tmp_output_file"; then
            echo "::error::Blueprint uses a command the web renderer does not know; declare it in blueprint/src/Packages/_tnlean_patches.py"
            exit 1
          fi
          if [ "$cmd_status" -ne 0 ]; then
            exit "$cmd_status"
          fi
          if grep -R "tenkz SVG unavailable" blueprint/web --include='*.html'; then
            echo "::error::Blueprint contains unrendered tenkz SVG placeholders"
            exit 1
          fi

      # A zero exit status says the build ran, not that the pages read. The
      # site is published from here, so the reader-facing check runs here too
      # and not only where a pull request is reviewed.
      - name: Test generated blueprint pages
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_blueprint_web_render.py --web-root blueprint/web

      - name: Build FT-MPS blueprint volume
        run: ./scripts/build_blueprint_ch01_12.sh

      - name: Package site components
        run: |
          mkdir -p site-blueprint site-badges
          cp -r blueprint/web site-blueprint/blueprint
          cp blueprint/print/print.pdf site-blueprint/blueprint.pdf
          cp blueprint/print/print12.pdf site-blueprint/blueprint-ch01-12.pdf
          python3 scripts/write_badges.py site-badges

      # Runs in Docker and produces root-owned output; keep it after the
      # packaging step so it only writes into the pre-created directory.
      - name: Build homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: site-blueprint/homepage

      - name: Upload blueprint component
        uses: actions/upload-artifact@v4
        with:
          name: site-blueprint
          path: site-blueprint
          retention-days: 30

      - name: Upload badges component
        uses: actions/upload-artifact@v4
        with:
          name: site-badges
          path: site-badges
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: blueprint
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
