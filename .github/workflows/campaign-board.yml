name: Campaign Board

# Hourly progress pages for the formalization campaigns, one per directory of
# docs/campaign/ (see docs/campaign/README.md): the two-dimensional area law and
# polynomial PEPS approximation (tracker #8733) and the one-dimensional area law
# and matrix product state approximation (tracker #9547), both under the label
# `openai-math`. The job reads issues and pull requests of TNLean and QICLean,
# both public, so the default token suffices. It renders one self-contained page
# per campaign into campaign-output/<slug>/, uploads them together as the
# `site-campaign` component and redeploys Pages, which serves each at /<slug>/.
# It calls no model and writes nothing to either repository.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: campaign-board
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  board:
    # Only main publishes: a dispatch on another branch would otherwise upload an
    # unmerged board under the production artifact name and deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Render campaign board
    timeout-minutes: 20
    steps:
      - name: Checkout TNLean
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout QICLean
        uses: actions/checkout@v7
        with:
          repository: LionSR/QICLean
          path: qiclean
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Collect and render every campaign
        # Each campaign reuses the file statistics of its published snapshot for
        # unchanged pull requests, which keeps the job within the token's hourly
        # quota. A missing snapshot is fine.
        env:
          GH_TOKEN: ${{ github.token }}
          QICLEAN_DIR: qiclean
        run: |
          set -euo pipefail
          for config in docs/campaign/*/config.json; do
            dir=$(dirname "$config")
            slug=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["slug"])' "$config")
            curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors "https://sirui-lu.com/TNLean/$slug/data.json" -o "previous-$slug.json" || rm -f "previous-$slug.json"
            PREVIOUS_SNAPSHOT="previous-$slug.json" python3 scripts/campaign_board/collect.py "$dir" "campaign-data-$slug.json"
            python3 scripts/campaign_board/render.py "$dir" "campaign-data-$slug.json" "campaign-output/$slug"
          done

      - name: Upload campaign component
        uses: actions/upload-artifact@v7
        with:
          name: site-campaign
          path: campaign-output
          retention-days: 7

  deploy:
    name: Deploy Pages site
    needs: board
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
