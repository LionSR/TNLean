name: Temporary swap prose format preflight
on:
  push:
    branches: [codex/7574-axiom-audit-20261115]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5ba83378717480526955d879068b9c8ce98b52d0
      - name: Check final Blueprint sources with pinned latexindent
        run: |
          scripts/latexindent --version
          CHECK_TMPDIR=$(mktemp -d)
          export CHECK_TMPDIR
          trap 'rm -rf "$CHECK_TMPDIR"' EXIT
          scripts/check_latexindent_formatting.sh --one blueprint/src/chapter/ch28_mpu_labelled_swap_equivalence.tex
          scripts/check_latexindent_formatting.sh --one blueprint/src/chapter/ch28_mpu_swap_stabilization.tex
