name: OpenAI provenance

on:
  pull_request:
    paths:
      - 'docs/provenance/**'
      - 'docs/openai-math-provenance.md'
      - 'LICENSES/**'
      - 'TNLean/**/*.lean'
      - 'scripts/*openai_provenance.py'
      - 'scripts/fixtures/openai_provenance/**'
      - '.github/workflows/openai-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'docs/provenance/**'
      - 'docs/openai-math-provenance.md'
      - 'LICENSES/**'
      - 'TNLean/**/*.lean'
      - 'scripts/*openai_provenance.py'
      - 'scripts/fixtures/openai_provenance/**'
      - '.github/workflows/openai-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install jsonschema==4.26.0
      - name: Validator regression fixtures
        run: python3 -m unittest discover -s scripts -p 'test_openai_provenance.py' -v
      - name: Pinned source for license and source audit
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: adc7f1241b42e322a6451854ab7e4b4c146bf78a
          path: .provenance-upstream
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /lean/LICENSE
            /lean/OAI/MathematicalPhysics/
            /preprints/Polynomial-PEPS-approximation-of-gapped-square-grid-ground-states-September-24-2026/build/sections/00-introduction.tex
          persist-credentials: false
      - name: Ledger, notices and license
        run: python3 scripts/check_openai_provenance.py --upstream-root .provenance-upstream
