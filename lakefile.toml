name = "TNLean"
version = "0.1.0"
keywords = ["math"]
# The default target builds the whole TNLean library.
defaultTargets = ["TNLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "Gametheory"
git = "https://github.com/LionSR/Brouwer.git"
rev = "439aaeb9caa7a7f943f9e72afc77751cbc5b0098"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib.git"
# The last CSLib commit on Lean v4.36.0-rc1, the parent of its v4.36.0-rc2 bump; move it
# with the next toolchain bump. Only the query framework under
# `Cslib/Algorithms/Lean/Query/` is imported.
rev = "acab13b776722f5efa897c780d6fa1a3069d709e"

[[require]]
name = "qiclean"
git = "https://github.com/LionSR/QICLean.git"
# Draft-only candidate; replace with the validated immutable semver release tag before merge.
rev = "c457682404aa548b4acd16ac27be5d3835e68892"

[[lean_lib]]
name = "TNLean"

# Text-based style linter driver for `Mathlib.Linter.TextBased.lintModules`.
# Run with `lake exe lint_style` (or `--fix` to auto-correct, `--github` for CI annotations).
[[lean_exe]]
name = "lint_style"
srcDir = "scripts"
root = "LintStyle"
supportInterpreter = true
