name = "TNLean"
version = "0.1.0"
keywords = ["math"]
# The default target builds the whole TNLean library.
defaultTargets = ["TNLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "Gametheory"
git = "https://github.com/LionSR/Brouwer.git"
rev = "439aaeb9caa7a7f943f9e72afc77751cbc5b0098"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[require]]
name = "qiclean"
git = "https://github.com/LionSR/QICLean.git"
# Includes QICLean #1020, the nested-cutoff viability estimates.
rev = "8af1f77d468fed30b84644f923b8ae319a2bc432"

[[lean_lib]]
name = "TNLean"

# Text-based style linter driver for `Mathlib.Linter.TextBased.lintModules`.
# Run with `lake exe lint_style` (or `--fix` to auto-correct, `--github` for CI annotations).
[[lean_exe]]
name = "lint_style"
srcDir = "scripts"
root = "LintStyle"
supportInterpreter = true
