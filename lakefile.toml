name = "TNLean"
version = "0.1.0"
keywords = ["math"]
# The default target builds the whole TNLean library.
defaultTargets = ["TNLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "Gametheory"
git = "https://github.com/LionSR/Brouwer.git"
rev = "ec93e4daed4ad8b4784a9d760e492832e7711433"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[require]]
name = "qiclean"
git = "https://github.com/LionSR/QICLean.git"
# Draft-only candidate; replace with the validated immutable semver release tag before merge.
rev = "d5037d843552c55a5919bc21366b2eec2559fe0f"

[[lean_lib]]
name = "TNLean"

# Text-based style linter driver for `Mathlib.Linter.TextBased.lintModules`.
# Run with `lake exe lint_style` (or `--fix` to auto-correct, `--github` for CI annotations).
[[lean_exe]]
name = "lint_style"
srcDir = "scripts"
root = "LintStyle"
supportInterpreter = true
