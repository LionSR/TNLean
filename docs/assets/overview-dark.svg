  <text x="518" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Collar scanning · Information amplification &amp; shells</text>
  <text x="518" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Dyadic cell partitions · Uniform boundary entropy bound</text>

  <!-- PEPS Card 3: PEPS FT & Parent Hamiltonians -->
  <rect x="504" y="214" width="354" height="48" rx="8" fill="#131822" stroke="#252b39" stroke-width="1.2"/>
  <text x="518" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eef1f7">PEPS Fundamental Theorem &amp; Parent H</text>
  <text x="518" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Gauge uniqueness on graphs, cycles &amp; tori · Reblocking</text>

  <!-- PEPS Card 4: Graph, Tensor, Injectivity -->
  <rect x="504" y="270" width="354" height="52" rx="8" fill="#131822" stroke="#252b39" stroke-width="1.2"/>
  <text x="518" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eef1f7">Graphs, Injectivity &amp; Topological Sectors</text>
  <text x="518" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Injective, G-injective &amp; normal PEPS · Anyons · Holonomy</text>

  <!-- Bottom Foundation Strip -->
  <rect x="26" y="346" width="388" height="32" rx="7" fill="#17233a" stroke="#2f4a7c" stroke-width="1.1"/>
  <text x="220" y="365.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#6895f5">QICLean  ·  Channels, QPF, Wielandt, Entropy, Filters, Lieb–Robinson</text>

  <rect x="426" y="346" width="248" height="32" rx="7" fill="#171c26" stroke="#252b39" stroke-width="1.1"/>
