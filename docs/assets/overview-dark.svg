<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 398" width="900" height="398" role="img" aria-label="TNLean architecture: built on Mathlib 4 and QICLean, organized into one-dimensional MPS theory (Fundamental Theorem, Parent Hamiltonians, Symmetries, MPDO, MPU/QCA, Preparation, 1D Area Laws) and two-dimensional PEPS theory (Graphs, Injectivity, Fundamental Theorem, Parent Hamiltonians, 2D Area Law, Polynomial PEPS Approximation).">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#aeb6c8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="6" y="6" width="888" height="386" rx="12" fill="#0f1219" stroke="#252b39" stroke-width="1.2"/>
  <text x="26" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#8b94a8">TNLEAN ARCHITECTURE</text>
  <text x="874" y="30" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.04em" fill="#8b94a8">1D MATRIX PRODUCT STATES  ·  2D PEPS  ·  ENTANGLEMENT AREA LAWS</text>

  <!-- LEFT COLUMN: 1D Tensor Networks (MPS & QCA) -->
  <rect x="26" y="42" width="446" height="292" rx="10" fill="#171c26" stroke="#6895f5" stroke-width="1.4"/>
  <text x="42" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#eef1f7">One-dimensional tensor networks</text>
  <rect x="372" y="50" width="86" height="18" rx="9" fill="#17233a" stroke="#2f4a7c" stroke-width="1"/>
  <text x="415.0" y="62.4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.0" font-weight="600" fill="#6895f5">TNLean/MPS</text>

  <!-- MPS Card 1: Area Laws & Preparation -->
  <rect x="42" y="78" width="414" height="62" rx="8" fill="#131822" stroke="#2f4a7c" stroke-width="1.2"/>
  <text x="56" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eef1f7">1D Area Laws, Algorithms &amp; Preparation</text>
  <text x="56" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Hastings · ALVV &amp; AKLV filters · Thermal cluster expansion</text>
  <text x="56" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Sequential ancilla &amp; log-depth circuit preparation</text>

  <!-- MPS Card 2: Symmetries, MPDO, MPU, QCA -->
  <rect x="42" y="148" width="414" height="58" rx="8" fill="#131822" stroke="#252b39" stroke-width="1.2"/>
  <text x="56" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eef1f7">Symmetries, SPT, MPDO, MPU &amp; QCA</text>
  <text x="56" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">H²/H³ cocycles · String order · MPO fusion &amp; anomalies</text>
  <text x="56" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">MPDO canonical &amp; RFP forms · MPU gauging (CZX) · 1D QCA</text>

