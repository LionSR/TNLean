  <text x="56" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Tensor · Transfer · Operator · BNT · Single/multi-block · Periodic · Examples</text>

  <!-- RIGHT COLUMN: 2D & Lattice Tensor Networks (PEPS & Lattice) -->
  <rect x="488" y="42" width="386" height="292" rx="10" fill="#171c26" stroke="#9d79fa" stroke-width="1.4"/>
  <text x="504" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#eef1f7">Two-dimensional PEPS &amp; lattices</text>
