  <text x="56" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#aeb6c8">Frustration-free ground spaces · Martingale &amp; long-range gaps · Uncle H</text>

